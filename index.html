function rHistPeriodFilter(tickets){
  const period=window._rHistPeriod||'today';
  if(period==='all')return tickets;
  if(period==='today'){
    const dt=today();
    return tickets.filter(t=>t.date===dt);
  }
  if(period==='week'){
    const now=new Date();
    const day=now.getDay()||7;
    const monday=new Date(now);monday.setDate(now.getDate()-(day-1));monday.setHours(0,0,0,0);
    const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);sunday.setHours(23,59,59,999);
    return tickets.filter(t=>{const d=new Date((t.date||'')+'T00:00:00');return d>=monday&&d<=sunday;});
  }
  if(period==='month'){
    return tickets.filter(t=>t.date&&t.date.slice(0,7)===today().slice(0,7));
  }
  return tickets;
}

// ===================== PAYROLL (fixed 1st/15th commission statements) =====================
function _payrollRange(year,month,period){ // month is 0-11
  const pad=n=>String(n).padStart(2,'0');
  const mm=pad(month+1);
  if(period==='P1')return {from:`${year}-${mm}-01`,to:`${year}-${mm}-15`};
  const lastDay=new Date(year,month+1,0).getDate(); // handles Feb 28/29 and 30/31-day months
  return {from:`${year}-${mm}-16`,to:`${year}-${mm}-${pad(lastDay)}`};
}

function _payrollDefaultSelection(){
  const now=new Date();
  const day=now.getDate();
  if(day===1){
    const prev=new Date(now.getFullYear(),now.getMonth()-1,1);
    return {year:prev.getFullYear(),month:prev.getMonth(),period:'P2'};
  }
  if(day===15)return {year:now.getFullYear(),month:now.getMonth(),period:'P1'};
  return {year:now.getFullYear(),month:now.getMonth(),period:day<=15?'P1':'P2'}; // not specified by spec — default to the in-progress period
}

// Per-technician breakdown for [from,to]. Sales rows always show a ticket's full original
// gross/discount/tip on its sale date (a stable record of what was sold). Refunds/voids are
// NOT netted into those rows — a dollar refund can't be decomposed back into gross/discount/tip
// shares. Instead every refund/void whose OWN date falls in this period appears as a separate
// negative Adjustment line, dated by when the reversal actually happened (not the sale date), so
// a period's frozen/finalized numbers are never retroactively disturbed by a later refund.
function _payrollComputeForTech(techId,from,to){
  const allTickets=DB.get('tickets')||[];
  const tech=(DB.get('technicians')||[]).find(t=>t.id===techId);
  const rate=tech?(tech.commission||0.5):0.5;

  const dayMap={};
  const ensureDay=d=>dayMap[d]||(dayMap[d]={date:d,tickets:0,gross:0,discount:0,tip:0});
  allTickets.filter(t=>t.techId===techId&&t.status!=='voided'&&t.date>=from&&t.date<=to)
    .forEach(t=>{
      const r=ensureDay(t.date);
      r.tickets++;r.gross+=t.subtotal;r.discount+=(t.discount||0);r.tip+=(t.tip||0);
    });

  const adjustments=[];
  allTickets.filter(t=>t.techId===techId).forEach(t=>{
    (t.refunds||[]).forEach(rf=>{
      const rDate=new Date(rf.ts).toISOString().slice(0,10);
      if(rDate<from||rDate>to)return;
      adjustments.push({date:rDate,type:'Refund',ticketId:t.id,amount:rf.amount,reason:rf.reason||''});
    });
    if(t.status==='voided'&&t.voidedAt){
      const vDate=new Date(t.voidedAt).toISOString().slice(0,10);
      if(vDate>=from&&vDate<=to)adjustments.push({date:vDate,type:'Void',ticketId:t.id,amount:t.subtotal,reason:''});
    }
  });
  adjustments.sort((a,b)=>a.date<b.date?-1:1);

  const dayRows=Object.values(dayMap).sort((a,b)=>a.date<b.date?-1:1).map(r=>{
    const net=Math.max(0,r.gross-r.discount);
    const commission=net*rate;
    return Object.assign({},r,{net,commission,payout:commission+r.tip});
  });

  const grossTotal=dayRows.reduce((s,r)=>s+r.gross,0);
  const discountTotal=dayRows.reduce((s,r)=>s+r.discount,0);
  const tipsTotal=dayRows.reduce((s,r)=>s+r.tip,0);
  const ticketsTotal=dayRows.reduce((s,r)=>s+r.tickets,0);
  const adjustmentsTotal=adjustments.reduce((s,a)=>s+a.amount,0);
  const netTotal=Math.max(0,grossTotal-discountTotal-adjustmentsTotal);
  const commissionTotal=netTotal*rate;
  const payoutTotal=commissionTotal+tipsTotal;

  return {techId,rate,dayRows,adjustments,
    totals:{tickets:ticketsTotal,gross:grossTotal,discount:discountTotal,adjustments:adjustmentsTotal,net:netTotal,commission:commissionTotal,tips:tipsTotal,payout:payoutTotal}};
}

function _payrollComputeAll(from,to,includeZero){
  const techs=(DB.get('technicians')||[]).filter(t=>t.active).sort((a,b)=>a.name.localeCompare(b.name));
  const lines=techs.map(t=>Object.assign({techName:t.name},_payrollComputeForTech(t.id,from,to)))
    .filter(l=>includeZero||l.totals.tickets>0||l.adjustments.length>0);
  const grandTotal=lines.reduce((g,l)=>({
    tickets:g.tickets+l.totals.tickets,gross:g.gross+l.totals.gross,discount:g.discount+l.totals.discount,
    adjustments:g.adjustments+l.totals.adjustments,net:g.net+l.totals.net,commission:g.commission+l.totals.commission,
    tips:g.tips+l.totals.tips,payout:g.payout+l.totals.payout,headcount:g.headcount+1
  }),{tickets:0,gross:0,discount:0,adjustments:0,net:0,commission:0,tips:0,payout:0,headcount:0});
  return {lines,grandTotal};
}

// Single source of truth for the on-screen preview AND both exports, so a single-employee
// export always matches that employee's section of the all-employee export exactly.
function _payrollGetData(){
  const year=window._payrollYear,month=window._payrollMonth,period=window._payrollPeriod;
  const range=_payrollRange(year,month,period);
  const run=(DB.get('payrollRuns')||[]).find(r=>r.year===year&&r.month===month&&r.period===period);
  let allLines,grandTotal;
  if(run){allLines=run.lines;grandTotal=run.grandTotal;}
  else{const res=_payrollComputeAll(range.from,range.to,window._payrollIncludeZero);allLines=res.lines;grandTotal=res.grandTotal;}
  const scope=window._payrollScope;
  const lines=scope==='all'?allLines:allLines.filter(l=>l.techId===scope);
  return {locked:!!run,run,range,lines,allLines,grandTotal};
}

function finalizePayrollPeriod(){
  const year=window._payrollYear,month=window._payrollMonth,period=window._payrollPeriod;
  const runs=DB.get('payrollRuns')||[];
  if(runs.find(r=>r.year===year&&r.month===month&&r.period===period)){toast('This period is already finalized — use Regenerate instead');return;}
  const range=_payrollRange(year,month,period);
  if(!confirm(`Finalize payroll for ${period} (${fmtDate(range.from)} – ${fmtDate(range.to)})?\n\nThis locks the numbers so later ticket edits won't silently change this statement. You can Regenerate later if needed.`))return;
  const by=window._activeStaffName||prompt('Finalizing as (your name):','')||'Unknown';
  const {lines,grandTotal}=_payrollComputeAll(range.from,range.to,window._payrollIncludeZero);
  runs.push({id:genId(),year,month,period,from:range.from,to:range.to,lines,grandTotal,history:[{action:'finalized',at:Date.now(),by}]});
  DB.set('payrollRuns',runs);
  toast('Payroll period finalized and locked!');
  renderPayrollTabBody();
}

function regeneratePayrollPeriod(){
  const year=window._payrollYear,month=window._payrollMonth,period=window._payrollPeriod;
  const runs=DB.get('payrollRuns')||[];
  const run=runs.find(r=>r.year===year&&r.month===month&&r.period===period);
  if(!run){toast('This period is not finalized yet');return;}
  if(!confirm(`Regenerate the locked ${period} payroll (${fmtDate(run.from)} – ${fmtDate(run.to)})?\n\nThis recalculates from current ticket data and overwrites the locked statement. The change is logged.`))return;
  const by=window._activeStaffName||prompt('Regenerating as (your name):','')||'Unknown';
  const {lines,grandTotal}=_payrollComputeAll(run.from,run.to,window._payrollIncludeZero);
  run.lines=lines;run.grandTotal=grandTotal;
  run.history.push({action:'regenerated',at:Date.now(),by});
  DB.set('payrollRuns',runs);
  toast('Payroll period regenerated.');
  renderPayrollTabBody();
}

function exportPayrollCSV(){
  const {range,lines,grandTotal}=_payrollGetData();
  const esc=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const header=['row_type','employee','commission_rate','period_from','period_to','date','type','tickets','gross','discount','net','commission','tips','payout','reason'];
  const rows=[header.map(esc).join(',')];
  lines.forEach(l=>{
    const rate=(l.rate*100).toFixed(0)+'%';
    l.dayRows.forEach(r=>{
      rows.push(['daily',l.techName,rate,range.from,range.to,r.date,'',r.tickets,r.gross.toFixed(2),r.discount.toFixed(2),r.net.toFixed(2),r.commission.toFixed(2),r.tip.toFixed(2),r.payout.toFixed(2),''].map(esc).join(','));
    });
    l.adjustments.forEach(a=>{
      rows.push(['adjustment',l.techName,rate,range.from,range.to,a.date,a.type,'','','',(-a.amount).toFixed(2),'','','',a.reason||''].map(esc).join(','));
    });
    const t=l.totals;
    rows.push(['total',l.techName,rate,range.from,range.to,'','',t.tickets,t.gross.toFixed(2),t.discount.toFixed(2),t.net.toFixed(2),t.commission.toFixed(2),t.tips.toFixed(2),t.payout.toFixed(2),''].map(esc).join(','));
  });
  if(window._payrollScope==='all'){
    rows.push(['grand_total','ALL EMPLOYEES','',range.from,range.to,'','',grandTotal.tickets,grandTotal.gross.toFixed(2),grandTotal.discount.toFixed(2),grandTotal.net.toFixed(2),grandTotal.commission.toFixed(2),grandTotal.tips.toFixed(2),grandTotal.payout.toFixed(2),''].map(esc).join(','));
  }
  const csv=rows.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`payroll-${window._payrollYear}-${String(window._payrollMonth+1).padStart(2,'0')}-${window._payrollPeriod}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ===================== EMPLOYEE REPORTS (payroll / tax) =====================
function _empRange(period){
  if(period==='daily'){
    const d=window._rEmpDate||today();
    return {from:d,to:d,label:fmtDate(d)};
  }
  if(period==='weekly'){
    const monday=window._rEmpWeekOf||weekStrToMonday(toWeekStr(today()));
    const sunday=new Date(monday+'T00:00:00');sunday.setDate(sunday.getDate()+6);
    const to=sunday.toISOString().split('T')[0];
    return {from:monday,to,label:`Week of ${fmtDate(monday)} – ${fmtDate(to)}`};
  }
  if(period==='biweekly'){
    const start=window._rEmpBiStart||weekStrToMonday(toWeekStr(today()));
    const end=new Date(start+'T00:00:00');end.setDate(end.getDate()+13);
    const to=end.toISOString().split('T')[0];
    return {from:start,to,label:`Biweekly ${fmtDate(start)} – ${fmtDate(to)}`};
  }
  // yearly
  const yr=window._rEmpYear||new Date().getFullYear();
  return {from:`${yr}-01-01`,to:`${yr}-12-31`,label:`Year ${yr}`};
}

function _empStats(techId,range){
  const tickets=(DB.get('tickets')||[]).filter(t=>{
    if(t.status==='voided')return false;
    if(techId!=null&&t.techId!==techId)return false;
    return t.date>=range.from&&t.date<=range.to;
  });
  const gross=tickets.reduce((s,t)=>s+t.subtotal,0);
  const tips=tickets.reduce((s,t)=>s+(t.tip||0),0);
  const refunds=tickets.reduce((s,t)=>s+(t.refundedAmount||0),0);
  const net=Math.max(0,gross-refunds);
  return {tickets,count:tickets.length,gross,tips,refunds,net};
}

// Short, receipt-style version of the employee report — same narrow thermal-receipt
// look as a customer transaction receipt, for a quick handoff/paper trail.
function printEmployeeReceipt(techId,period){
  const techs=DB.get('technicians')||[];
  const t=techs.find(x=>x.id===techId);
  if(!t)return;
  const range=_empRange(period);
  const st=_empStats(techId,range);
  const settings=DB.get('settings')||{};
  const salonName=settings.salonName||'Nail Salon';
  const dateStr=new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const divider=`<div style="border-top:1px dashed #000;margin:6px 0"></div>`;

  const lines=st.tickets.slice().reverse().map(tk=>`
    <div style="display:flex;justify-content:space-between;font-size:9pt;margin:2px 0;gap:8px">
      <span>${fmtDate(tk.date)} — ${(tk.services||[]).map(s=>s.name).join(', ')}</span>
      <span style="white-space:nowrap">${fmt(tk.subtotal)}</span>
    </div>`).join('')||`<div style="text-align:center;font-size:9pt;color:#555;padding:6px 0">No transactions in this period</div>`;

  const html=`<div style="width:64mm;font-family:'Segoe UI',Arial,sans-serif">
    <div style="text-align:center;margin-bottom:8px">
      <div style="font-size:15pt;font-weight:700">${salonName}</div>
      <div style="font-size:9pt;margin-top:2px">Employee Report — ${t.name}</div>
      <div style="font-size:8pt;color:#555">${range.label}</div>
      <div style="font-size:8pt;color:#555">Printed ${dateStr}</div>
    </div>
    ${divider}
    ${lines}
    ${divider}
    <div style="display:flex;justify-content:space-between;font-size:12pt;font-weight:700;margin:4px 0"><span>TOTAL</span><span>${fmt(st.gross)}</span></div>
    <div style="text-align:center;font-size:8pt;color:#555;margin-top:2px">${st.count} transaction${st.count!==1?'s':''}</div>
  </div>`;

  const pr=document.getElementById('print-receipt');
  pr.innerHTML=html;
  window.print();
}

function printEndOfDay(){
  const dt=today();
  const tickets=(DB.get('tickets')||[]).filter(t=>t.date===dt&&t.status!=='voided').map(t=>{
    const refunded=t.refundedAmount||0;
    if(refunded<=0)return t;
    return Object.assign({},t,{subtotal:Math.max(0,t.subtotal-refunded),total:Math.max(0,t.total-refunded)});
  });
  const techs=DB.get('technicians')||[];
  const customers=DB.get('customers')||[];

  const rev=tickets.reduce((s,t)=>s+t.subtotal,0);
  const tips=tickets.reduce((s,t)=>s+(t.tip||0),0);
  const disc=tickets.reduce((s,t)=>s+(t.discount||0),0);
  const total=tickets.reduce((s,t)=>s+t.total,0);

  const techStats=techs.map(t=>{
    const tt=tickets.filter(x=>x.techId===t.id);
    const r=tt.reduce((s,x)=>s+x.subtotal,0);
    const tps=tt.reduce((s,x)=>s+(x.tip||0),0);
    return {name:t.name,tickets:tt.length,revenue:r,tips:tps,payout:r*(t.commission||0.5)};
  }).filter(t=>t.tickets>0).sort((a,b)=>b.revenue-a.revenue);

  const payMap={};
  tickets.forEach(t=>{const k=t.payMethod||'cash';payMap[k]=(payMap[k]||0)+t.total;});

  const techRows=techStats.map(t=>`
    <tr><td>${t.name}</td><td>${t.tickets}</td><td>${fmt(t.revenue)}</td><td>${fmt(t.tips)}</td><td><strong>${fmt(t.payout)}</strong></td></tr>`).join('')||'<tr><td colspan="5" style="color:#aaa;text-align:center">No data</td></tr>';

  const ticketRows=tickets.slice().reverse().map(t=>{
    const cust=customers.find(c=>c.id===t.customerId);
    const tech=techs.find(x=>x.id===t.techId);
    return `<tr><td>#${String(t.id).slice(-4)}</td><td>${cust?cust.name:'Walk-in'}</td><td>${tech?tech.name:'—'}</td><td>${(t.services||[]).map(s=>s.name).join(', ')}</td><td>${fmt(t.total)}</td><td>${t.payMethod||'cash'}</td></tr>`;
  }).join('')||'<tr><td colspan="6" style="color:#aaa;text-align:center;padding:20px">No tickets today</td></tr>';

  const payRows=Object.entries(payMap).map(([k,v])=>`<tr><td>${k.toUpperCase()}</td><td>${fmt(v)}</td></tr>`).join('')||'<tr><td colspan="2">—</td></tr>';

  const salon=(DB.get('settings')||{}).salonName||'Nail Salon';
  const printWin=window.open('','_blank','width=700,height=900');
  printWin.document.write(`<!DOCTYPE html><html><head><title>End of Day Report - ${dt}</title>
  <style>
    body{font-family:'Segoe UI',sans-serif;padding:30px;color:#111;max-width:680px;margin:0 auto}
    h1{font-size:22px;margin-bottom:4px}h2{font-size:16px;margin:20px 0 8px;border-bottom:2px solid #eee;padding-bottom:4px}
    p{font-size:13px;color:#666;margin-bottom:16px}
    table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px}
    th{text-align:left;padding:7px 10px;background:#f5f5f5;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
    td{padding:7px 10px;border-bottom:1px solid #f0f0f0}
    .totals{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:16px 0}
    .tot{background:#f8f9fb;border-radius:8px;padding:14px}
    .tot .lbl{font-size:11px;color:#888;text-transform:uppercase;margin-bottom:4px}
    .tot .val{font-size:22px;font-weight:700;color:#ff6b9d}
    @media print{button{display:none!important}}
  </style></head><body>
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div><h1>${salon}</h1><p>End of Day Report &mdash; ${fmtDate(dt)}</p></div>
    <button onclick="window.print()" style="padding:10px 20px;background:#ff6b9d;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer">🖨 Print</button>
  </div>
  <h2>Summary</h2>
  <div class="totals">
    <div class="tot"><div class="lbl">Revenue</div><div class="val">${fmt(rev)}</div></div>
    <div class="tot"><div class="lbl">Tips</div><div class="val">${fmt(tips)}</div></div>
    <div class="tot"><div class="lbl">Discounts</div><div class="val">${fmt(disc)}</div></div>
    <div class="tot"><div class="lbl">Net Collected</div><div class="val" style="color:#22c55e">${fmt(total)}</div></div>
  </div>
  <p style="font-size:13px;color:#666">${tickets.length} ticket${tickets.length!==1?'s':''} today</p>

  <h2>Payment Breakdown</h2>
  <table><thead><tr><th>Method</th><th>Total</th></tr></thead><tbody>${payRows}</tbody></table>

  <h2>Technician Report</h2>
  <table><thead><tr><th>Tech</th><th>Tickets</th><th>Revenue</th><th>Tips</th><th>Payout (${Math.round((techs[0]?.commission||0.5)*100)}%)</th></tr></thead>
  <tbody>${techRows}</tbody></table>

  <h2>All Tickets</h2>
  <table><thead><tr><th>Ticket</th><th>Customer</th><th>Tech</th><th>Services</th><th>Total</th><th>Payment</th></tr></thead>
  <tbody>${ticketRows}</tbody></table>
  <p style="margin-top:24px;font-size:11px;color:#aaa;text-align:center">Generated ${new Date().toLocaleString()}</p>
  </body></html>`);
  printWin.document.close();
  const _settings=DB.get('settings')||{};
  if(_settings.autoPrintBatch!==false) setTimeout(()=>printWin.print(), 400);
}

// ── Code 39 barcode (self-contained, no external deps — works with any USB/keyboard-wedge scanner) ──
function _code39Patterns(){
  return {
    '0':'NNNWWNWNN','1':'WNNWNNNNW','2':'NNWWNNNNW','3':'WNWWNNNNN','4':'NNNWWNNNW',
    '5':'WNNWWNNNN','6':'NNWWWNNNN','7':'NNNWNNWNW','8':'WNNWNNWNN','9':'NNWWNNWNN',
    '-':'NNNNWWNNW','*':'NNNWNWWNN'
  };
}

function buildBarcodeSVG(text,opts){
  opts=opts||{};
  const narrow=opts.narrow||2, wide=narrow*3, barH=opts.height||64, quiet=narrow*10;
  const pat=_code39Patterns();
  const clean=String(text).toUpperCase().replace(/[^0-9\-]/g,'');
  const chars=('*'+clean+'*').split('');
  let x=quiet, bars='';
  chars.forEach(ch=>{
    const p=pat[ch]; if(!p)return;
    for(let i=0;i<p.length;i++){
      const w=(p[i]==='W'?wide:narrow);
      if(i%2===0) bars+=`<rect x="${x}" y="0" width="${w}" height="${barH}" fill="#000"/>`;
      x+=w;
    }
    x+=narrow;
  });
  const totalW=x+quiet, totalH=barH+24;
  const dims=opts.responsive?'width="100%" height="auto"':`width="${totalW}" height="${totalH}"`;
  return `<svg xmlns="http://www.w3.org/2000/svg" ${dims} viewBox="0 0 ${totalW} ${totalH}" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="${totalW}" height="${totalH}" fill="#fff"/>
    ${bars}
    <text x="${totalW/2}" y="${barH+18}" text-anchor="middle" font-family="monospace" font-size="15" letter-spacing="1" fill="#000">${clean}</text>
  </svg>`;
}

async function gcDo(action){
  const idEl=document.getElementById('gc_id');
  const id=(idEl.value||'').trim();
  const result=document.getElementById('gc_result');
  const settings=DB.get('settings')||{};
  const barcodeOn=()=>{const cb=document.getElementById('gc_barcode_opt');return cb?cb.checked:true;};
  const barcodeBtn=(code,bal)=>`<button class="btn btn-sm btn-outline" style="margin-top:8px;margin-left:8px" onclick="printBarcodeLabel('${code}',${bal})">🏷 Print Barcode Label</button>`;
  const printBtn=(a,code,amt,bal)=>`<button class="btn btn-sm btn-outline" style="margin-top:8px" onclick="printGiftCardReceipt('${a}','${code}',${amt==null?'null':amt},${bal},document.getElementById('gc_barcode_opt')?document.getElementById('gc_barcode_opt').checked:true)">🖨 Print Receipt</button>`;
  const errBox=(msg)=>`<div style="padding:16px;background:#fff3f3;border-radius:10px;color:#e53e3e;font-weight:700">${msg}</div>`;

  if(action==='balance'){
    if(!id){toast('Enter or scan a card code');return;}
    try{
      const res=await fetch('/api/giftcard?code='+encodeURIComponent(id));
      const data=await res.json();
      if(!res.ok){result.innerHTML=errBox(data.error||'Card not found');return;}
      result.innerHTML=`<div style="padding:20px;background:#f0fff4;border-radius:10px;text-align:center">
        <div style="font-size:12px;color:#666;margin-bottom:4px;letter-spacing:.5px">CARD ${data.gc_code} BALANCE</div>
        <div style="font-size:36px;font-weight:800;color:#22c55e">${fmt(data.balance)}</div>
        <div style="font-size:11px;color:#aaa;margin-top:4px">Status: ${data.status}</div>
        ${barcodeBtn(data.gc_code,data.balance)}
      </div>`;
    }catch{result.innerHTML=errBox('Server not reachable — start the server first');}
    return;
  }

  const amtEl=document.getElementById('gc_amt');
  const amt=parseFloat(amtEl?amtEl.value:0);

  if(action==='new'){
    if(isNaN(amt)||amt<0){toast('Enter a valid starting balance (0 or more)');return;}
    try{
      const res=await fetch('/api/giftcard/new',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({gc_code:id,balance:amt})});
      const data=await res.json();
      if(!res.ok){result.innerHTML=errBox(data.error||'Could not create card');return;}
      idEl.value=data.gc_code;
      result.innerHTML=`<div style="padding:16px;background:#f0fff4;border-radius:10px;color:#22c55e;font-weight:700">
        Card created! Code: ${data.gc_code} — balance: ${fmt(data.balance)}
        ${printBtn('new',data.gc_code,amt,data.balance)}${barcodeBtn(data.gc_code,data.balance)}</div>`;
      if(amtEl)amtEl.value='';
      toast('Gift card created!');
      if(settings.autoPrintGiftcard!==false)setTimeout(()=>printGiftCardReceipt('new',data.gc_code,amt,data.balance,barcodeOn()),300);
    }catch{result.innerHTML=errBox('Server not reachable — start the server first');}
    return;
  }

  if(!id){toast('Enter or scan a card code');return;}

  if(action==='refill'){
    if(isNaN(amt)||amt<=0){toast('Enter a valid amount');return;}
    try{
      const res=await fetch('/api/giftcard/refill',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({code:id,amount:amt})});
      const data=await res.json();
      if(!res.ok){result.innerHTML=errBox(data.error||'Could not reload card');return;}
      result.innerHTML=`<div style="padding:16px;background:#f0fff4;border-radius:10px;color:#22c55e;font-weight:700">
        Loaded ${fmt(amt)}. Card ${data.gc_code} balance: ${fmt(data.balance_after)}
        ${printBtn('refill',data.gc_code,amt,data.balance_after)}${barcodeBtn(data.gc_code,data.balance_after)}</div>`;
      if(amtEl)amtEl.value='';
      toast('Card loaded!');
      if(settings.autoPrintGiftcard!==false)setTimeout(()=>printGiftCardReceipt('refill',data.gc_code,amt,data.balance_after,barcodeOn()),300);
    }catch{result.innerHTML=errBox('Server not reachable — start the server first');}
    return;
  }

  if(action==='charge'){
    if(isNaN(amt)||amt<=0){toast('Enter a valid amount');return;}
    try{
      const res=await fetch('/api/giftcard/charge',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({code:id,amount:amt})});
      const data=await res.json();
      if(!res.ok){result.innerHTML=errBox(data.error||'Could not charge card');return;}
      result.innerHTML=`<div style="padding:16px;background:#f0fff4;border-radius:10px;color:#22c55e;font-weight:700">
        Charged ${fmt(amt)}. Card ${data.gc_code} new balance: ${fmt(data.balance_after)}
        ${printBtn('charge',data.gc_code,amt,data.balance_after)}${barcodeBtn(data.gc_code,data.balance_after)}</div>`;
      if(amtEl)amtEl.value='';
      toast('Card charged!');
      if(settings.autoPrintGiftcard!==false)setTimeout(()=>printGiftCardReceipt('charge',data.gc_code,amt,data.balance_after,barcodeOn()),300);
    }catch{result.innerHTML=errBox('Server not reachable — start the server first');}
  }
}

            ${Object.entries(_mktTemplates()).map(([key,t])=>`<button type="button" onclick="applyMktTemplate('${key}')" style="padding:8px 14px;border:1.5px solid #e0e0e0;border-radius:20px;background:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap" onmouseover="this.style.borderColor='#ff6b9d'" onmouseout="this.style.borderColor='#e0e0e0'">${t.label}</button>`).join('')}
            <div style="display:flex;align-items:center;gap:6px;margin-left:4px">
              <input id="mkt_discount" type="number" min="1" max="90" value="${window._mktDiscount||15}" oninput="window._mktDiscount=parseInt(this.value)||15" style="width:56px;padding:6px 8px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;text-align:center">
              <span style="font-size:12px;color:#888">% off</span>
            </div>
          </div>
        </div>

        ${ch.email?`<div class="form-group"><label>Subject (email only)</label><input id="mkt_subject" placeholder="e.g. 20% off this weekend!" value="${window._mktSubject||''}"></div>`:''}
        <div class="form-group"><label>Message</label>
          <textarea id="mkt_body" rows="5" placeholder="e.g. It's your lucky week! Book any gel manicure and get 20% off through Sunday. Reply STOP to opt out." style="width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical">${window._mktBody||''}</textarea>
        </div>

        <button class="btn btn-primary" onclick="sendMarketingCampaign()" style="margin-top:8px">🚀 Send Now</button>
        <div id="mktSendResult" style="margin-top:14px"></div>
      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:12px">Audience</div>
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0;border-bottom:1px solid #f5f5f5;font-weight:600">
          <input type="checkbox" ${window._mktSelected===null?'checked':''} onchange="window._mktSelected=this.checked?null:new Set();renderMarketing()" style="width:16px;height:16px;accent-color:#ff6b9d">
          All customers
        </label>
        <div style="font-size:12px;color:#888;margin:10px 0">
          ${customers.length} customer${customers.length!==1?'s':''} total · ${withPhone} with a phone number · ${withEmail} with an email
        </div>
        ${window._mktSelected!==null?`
        <div style="max-height:320px;overflow-y:auto;border-top:1px solid #f5f5f5">
          ${customers.length?customers.map(c=>`
          <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:13px">
            <input type="checkbox" ${window._mktSelected.has(c.id)?'checked':''} onchange="this.checked?window._mktSelected.add(${c.id}):window._mktSelected.delete(${c.id})" style="width:15px;height:15px;accent-color:#ff6b9d">
            <span>${c.name}</span>
            <span style="color:#aaa;font-size:11px">${c.phone||''}${c.phone&&c.email?' · ':''}${c.email||''}</span>
          </label>`).join(''):'<div style="color:#aaa;padding:16px 0">No customers yet</div>'}
        </div>`:''}
      </div>
    </div>`;
}

function _mktAudience(){
  const customers=DB.get('customers')||[];
  return window._mktSelected===null?customers:customers.filter(c=>window._mktSelected.has(c.id));
}

async function sendMarketingCampaign(){
  const ch=window._mktChannel;
  const bodyEl=document.getElementById('mkt_body');
  const subjEl=document.getElementById('mkt_subject');
  window._mktBody=bodyEl?bodyEl.value:'';
  window._mktSubject=subjEl?subjEl.value:'';
  const text=(window._mktBody||'').trim();
  const subject=(window._mktSubject||'').trim();
  const resultEl=document.getElementById('mktSendResult');

  if(!ch.sms&&!ch.email){toast('Pick at least one channel (SMS or Email)');return;}
  if(!text){toast('Write a message first');return;}

  const audience=_mktAudience();
  if(!audience.length){toast('No customers in the selected audience');return;}

  let summary=[];
  const campaign={id:genId(),ts:Date.now(),channels:[],audience:audience.length,subject,body:text,results:{}};

  if(ch.sms){
    const to=audience.filter(c=>c.phone).map(c=>c.phone);
    campaign.channels.push('sms');
    if(!to.length){summary.push('SMS: no customers in this audience have a phone number');}
    else{
      try{
        const res=await fetch('/api/sms/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to,body:text})});
        const data=await res.json();
        if(!res.ok){summary.push('SMS failed: '+(data.error||'unknown error'));}
        else{summary.push(`SMS: sent ${data.sent}/${to.length}${data.failed.length?', '+data.failed.length+' failed':''}`);campaign.results.sms=data;}
      }catch{summary.push('SMS failed: server not reachable');}
    }
  }
  if(ch.email){
    const to=audience.filter(c=>c.email).map(c=>c.email);
    campaign.channels.push('email');
    if(!to.length){summary.push('Email: no customers in this audience have an email address');}
    else{
      try{
        const res=await fetch('/api/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to,subject,body:text})});
        const data=await res.json();
        if(!res.ok){summary.push('Email failed: '+(data.error||'unknown error'));}
        else{summary.push(`Email: sent ${data.sent}/${to.length}${data.failed.length?', '+data.failed.length+' failed':''}`);campaign.results.email=data;}
      }catch{summary.push('Email failed: server not reachable');}
    }
  }

  const campaigns=DB.get('campaigns')||[];
  campaigns.unshift(campaign);
  DB.set('campaigns',campaigns.slice(0,200));

  if(resultEl)resultEl.innerHTML=`<div style="padding:12px 14px;background:#f5f5f7;border-radius:8px;font-size:13px;line-height:1.7">${summary.map(s=>`<div>${s}</div>`).join('')}</div>`;
  toast('Campaign sent');
}

// ── Startup ──────────────────────────────────────────────────────────
(async()=>{
  // Load from server first so server data wins over local defaults
  await DB.load();
  // Clear stale service list if it has < 13 entries (old default set)
  const _svcs=DB.get('services')||[];
  if(_svcs.length<13) localStorage.removeItem('npos_services');
  initData();
  showPage('dashboard');
  DB.startPolling(()=>{
    const activeLink=document.querySelector('#sidebar nav a.active');
    const page=activeLink?activeLink.id.replace('nav-',''):'dashboard';
    showPage(page);
  });
  _lockSetupListeners();

})();

// ─── Auto-Lock Screen (staff PIN) ──────────────────────────────────────────────
window._locked=false;
window._lockBuffer='';
window._lockLastActivity=Date.now();
window._lockTimer=null;

function _lockTouch(){
  window._lockLastActivity=Date.now();
}

function _lockSetupListeners(){
  ['mousedown','mousemove','wheel','touchstart'].forEach(evt=>{
    document.addEventListener(evt,()=>{ if(!window._locked) _lockTouch(); },{passive:true});
  });
  document.addEventListener('keydown',(e)=>{
    if(window._locked){
      if(/^[0-9]$/.test(e.key)){ e.preventDefault(); _lockPress(e.key); }
      else if(e.key==='Backspace'){ e.preventDefault(); _lockBackspace(); }
      return;
    }
    _lockTouch();
  });
}

function _lockInit(){
  if(window._lockTimer){ clearInterval(window._lockTimer); window._lockTimer=null; }
  window._lockTimer=setInterval(_lockCheck,1000);
  _lockTouch();
}

function _lockCheck(){
  const s=DB.get('settings')||{};
  if(s.lockEnabled===false) return;
  if(window._locked) return;
  const techs=(DB.get('technicians')||[]).filter(t=>t.pin);
  if(!techs.length && !s.masterPin) return; // no PIN configured anywhere — never lock (avoid lockout)
  const timeoutMs=(s.lockTimeoutSec||30)*1000;
  if(Date.now()-window._lockLastActivity>=timeoutMs) showLockScreen();
}

function showLockScreen(){
  if(window._locked) return;
  window._locked=true;
  window._lockBuffer='';
  const salon=(DB.get('settings')||{}).salonName||'Nail Salon';
  const el=document.createElement('div');
  el.id='lockScreen';
  el.style.cssText='position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#1a1a2e,#2d2d4e);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:"Segoe UI",Arial,sans-serif;user-select:none';
  const keys=[1,2,3,4,5,6,7,8,9];
  el.innerHTML=`
    <div style="font-size:24px;font-weight:800;margin-bottom:6px">${salon}</div>
    <div style="font-size:14px;color:#8888aa;margin-bottom:26px">🔒 Screen Locked — Enter Staff PIN</div>
    <div id="lockDots" style="display:flex;gap:12px;margin-bottom:14px"></div>
    <div id="lockError" style="height:18px;color:#f87171;font-size:13px;font-weight:600;margin-bottom:12px"></div>
    <div style="display:grid;grid-template-columns:repeat(3,72px);gap:14px">
      ${keys.map(n=>`<button onclick="_lockPress('${n}')" style="height:72px;border-radius:50%;border:none;background:#2d2d4e;color:#fff;font-size:24px;font-weight:700;cursor:pointer">${n}</button>`).join('')}
      <button onclick="_lockClear()" style="height:72px;border-radius:50%;border:none;background:#3d3d5e;color:#fff;font-size:12px;font-weight:700;cursor:pointer">Clear</button>
      <button onclick="_lockPress('0')" style="height:72px;border-radius:50%;border:none;background:#2d2d4e;color:#fff;font-size:24px;font-weight:700;cursor:pointer">0</button>
      <button onclick="_lockBackspace()" style="height:72px;border-radius:50%;border:none;background:#3d3d5e;color:#fff;font-size:20px;font-weight:700;cursor:pointer">⌫</button>
    </div>`;
  document.body.appendChild(el);
  _lockRenderDots();
}

function _lockRenderDots(){
  const dotsEl=document.getElementById('lockDots');
  if(!dotsEl)return;
  const len=window._lockBuffer.length;
  dotsEl.innerHTML=Array.from({length:4},(_,i)=>`<div style="width:16px;height:16px;border-radius:50%;background:${i<len?'#ff6b9d':'transparent'};border:2px solid #ff6b9d"></div>`).join('');
}

function _lockPress(d){
  if(!window._locked||window._lockBuffer.length>=4)return;
  window._lockBuffer+=d;
  const errEl=document.getElementById('lockError'); if(errEl)errEl.textContent='';
  _lockRenderDots();
  if(window._lockBuffer.length===4) _lockTryUnlock();
}

function _lockBackspace(){
  window._lockBuffer=window._lockBuffer.slice(0,-1);
  _lockRenderDots();
}

function _lockClear(){
  window._lockBuffer='';
  _lockRenderDots();
  const errEl=document.getElementById('lockError'); if(errEl)errEl.textContent='';
}

function _lockTryUnlock(){
  const s=DB.get('settings')||{};
  const buf=window._lockBuffer;
  if(s.masterPin && buf===s.masterPin){ _lockUnlock('Manager'); return; }
  const techs=DB.get('technicians')||[];
  const match=techs.find(t=>t.pin && t.pin===buf);
  if(match){ _lockUnlock(match.name); return; }
  const errEl=document.getElementById('lockError');
  if(errEl)errEl.textContent='Incorrect PIN';
  window._lockBuffer='';
  setTimeout(_lockRenderDots,10);
}

function _lockUnlock(name){
  const el=document.getElementById('lockScreen');
  if(el)el.remove();
  window._locked=false;
  window._lockBuffer='';
  window._activeStaffName=name;
  _lockTouch();
  toast(`Unlocked — ${name}`);
}


// ─── Customer Display Sync ────────────────────────────────────────────────────
let _displayPollTimer = null;

async function syncDisplay(state, extraData){
  const settings = DB.get('settings')||{};
  let data = {salonName: settings.salonName||'Nail Salon'};

  if(state === 'review'){
    const sub = ticketState.services.reduce((s,x)=>s+x.price, 0);
    const disc = parseFloat(ticketState.discount)||0;
    const tax  = sub * (settings.taxRate||0) / 100;
    const tipOptions = settings.tipDefault||[15,18,20,25];
    data = Object.assign(data, {
      salonName:  settings.salonName||'Nail Salon',
      services:   ticketState.services,
      subtotal:   sub,
      discount:   disc,
      tax:        tax,
      tip:        ticketState.tipAmt||0,
      tipOptions: tipOptions,
      total:      Math.max(0, sub - disc + tax + (ticketState.tipAmt||0)),
      ticketId:   Date.now(),
    });
    // Start polling for customer tip selection
    _startDisplayPoll();
  } else {
    _stopDisplayPoll();
    if(extraData) data = Object.assign(data, extraData);
  }

  try{
    await fetch('/api/display', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({state, data})
    });
  } catch(e){}
}

function _startDisplayPoll(){
  _stopDisplayPoll();
  _displayPollTimer = setInterval(async()=>{
    try{
      const res = await fetch('/api/display');
      const d = await res.json();
      // If customer selected a tip, update POS
      if(d.tip !== null && d.tip !== undefined && d.tip !== ticketState.tipAmt){
        ticketState.tipAmt = d.tip;
        ticketState.customTip = d.tip > 0 ? String(d.tip) : '';
        renderTicketStep();
      }
    } catch(e){}
  }, 1500);
}

function _stopDisplayPoll(){
  if(_displayPollTimer){ clearInterval(_displayPollTimer); _displayPollTimer = null; }
}

// ─── PAX Q30 Terminal (TSYS / POSLINK) ───────────────────────────────────────
async function testTerminalConnection(){
  const ip=(document.getElementById('ss_tip')||{}).value||'';
  const port=parseInt((document.getElementById('ss_tport')||{}).value||10009);
  const el=document.getElementById('terminal-test-result');
  if(!ip){if(el)el.innerHTML='<span style="color:#f97316">⚠ Enter an IP address first</span>';return;}
  if(el)el.innerHTML='<span style="color:#888">📡 Testing connection…</span>';
  try{
    const res=await fetch('/api/terminal/ping',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ip,port})});
    const data=await res.json();
    if(el){
      if(data.ok){el.innerHTML=`<span style="color:#16a34a">✅ ${data.message}</span>`;}
      else{el.innerHTML=`<span style="color:#ef4444">❌ ${data.message}</span>`;}
    }
  } catch(e){
    if(el)el.innerHTML=`<span style="color:#ef4444">❌ Server error: ${e.message}</span>`;
  }
}

async function chargeTerminal(total){
  const settings=DB.get('settings')||{};
  const ip=settings.terminalIp||'';
  const port=settings.terminalPort||10009;
  if(!ip){toast('Terminal IP not set — go to Settings → Terminal');return;}
  const btn=document.getElementById('terminalChargeBtn');
  const statusEl=document.getElementById('terminalStatus');
  const ref=String(Date.now()).slice(-6);
  if(btn){btn.disabled=true;btn.textContent='⏳ Waiting for card…';}
  if(statusEl)statusEl.innerHTML='<span style="color:#4d7cfe">Present card on the terminal · Tap, chip, or swipe</span>';
  try{
    const res=await fetch('/api/terminal/sale',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ip,port,amount:total-(ticketState.tipAmt||0),tip:ticketState.tipAmt||0,ref})
    });
    const data=await res.json();
    if(!res.ok){
      if(btn){btn.disabled=false;btn.textContent=`💳 Charge Terminal $${total.toFixed(2)}`;}
      if(statusEl)statusEl.innerHTML=`<span style="color:#ef4444">❌ ${data.error||'Terminal error'}</span>`;
      return;
    }
    if(data.approved){
      ticketState._terminalAuth={authCode:data.auth_code,transId:data.trans_id,cardType:data.card_type,last4:data.last4,ref};
      if(statusEl)statusEl.innerHTML=`<span style="color:#16a34a">✅ Approved · Auth: ${data.auth_code}${data.last4?' · ····'+data.last4:''}</span>`;
      toast(`✅ Approved — ${data.card_type||'Card'}${data.last4?' ····'+data.last4:''}`);
      setTimeout(()=>completeTicket(),800);
    } else {
      if(btn){btn.disabled=false;btn.textContent=`💳 Charge Terminal $${total.toFixed(2)}`;}
      if(statusEl)statusEl.innerHTML=`<span style="color:#ef4444">❌ ${data.message||'Declined'} — try another payment method</span>`;
      toast(`❌ ${data.message||'Card declined'}`);
    }
  } catch(e){
    if(btn){btn.disabled=false;btn.textContent=`💳 Charge Terminal $${total.toFixed(2)}`;}
    if(statusEl)statusEl.innerHTML=`<span style="color:#ef4444">❌ Cannot reach terminal: ${e.message}</span>`;
    toast('Cannot reach terminal — check IP in Settings');
  }
}
