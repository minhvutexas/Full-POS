<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nail POS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e;display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
#sidebar{width:200px;background:#1a1a2e;color:#fff;display:flex;flex-direction:column;flex-shrink:0}
#sidebar .logo{padding:20px 16px;font-size:20px;font-weight:700;color:#ff6b9d;border-bottom:1px solid #2d2d4e}
#sidebar .logo span{font-size:12px;color:#8888aa;display:block;font-weight:400}
#sidebar nav{flex:1;padding:8px 0}
#sidebar nav a{display:flex;align-items:center;gap:10px;padding:12px 16px;color:#aaa;text-decoration:none;font-size:14px;cursor:pointer;transition:all .15s}
#sidebar nav a:hover{background:#2d2d4e;color:#fff}
#sidebar nav a.active{background:#ff6b9d;color:#fff;font-weight:600}
#sidebar nav a .icon{font-size:18px;width:20px;text-align:center}
#sidebar .bottom{padding:12px 16px;border-top:1px solid #2d2d4e;font-size:12px;color:#666}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e0e0e0;flex-shrink:0}
#topbar h1{font-size:18px;font-weight:600}
#topbar .time{font-size:13px;color:#666}
#content{flex:1;overflow-y:auto;padding:20px}

/* CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-card .label{font-size:12px;color:#888;margin-bottom:6px}
.stat-card .value{font-size:24px;font-weight:700}
.stat-card .sub{font-size:12px;color:#888;margin-top:4px}
.stat-card.pink .value{color:#ff6b9d}
.stat-card.blue .value{color:#4d7cfe}
.stat-card.green .value{color:#22c55e}
.stat-card.orange .value{color:#f97316}

/* BUTTONS */
.btn{padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s}
.btn-primary{background:#ff6b9d;color:#fff}
.btn-primary:hover{background:#e8558a}
.btn-secondary{background:#f0f2f5;color:#333}
.btn-secondary:hover{background:#e0e2e5}
.btn-success{background:#22c55e;color:#fff}
.btn-success:hover{background:#16a34a}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-outline{background:#fff;border:2px solid #ff6b9d;color:#ff6b9d}
.btn-outline:hover{background:#fff0f5}
.btn-lg{padding:14px 28px;font-size:16px}
.btn-sm{padding:6px 12px;font-size:12px}

/* TABLE */
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:16px;font-weight:600}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;font-size:12px;color:#888;border-bottom:2px solid #f0f2f5;font-weight:600;text-transform:uppercase}
td{padding:10px 12px;font-size:14px;border-bottom:1px solid #f5f5f5}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#dcfce7;color:#16a34a}
.badge-yellow{background:#fef9c3;color:#ca8a04}
.badge-red{background:#fee2e2;color:#dc2626}
.badge-blue{background:#dbeafe;color:#2563eb}
.badge-pink{background:#fce7f3;color:#be185d}

/* FORMS */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;transition:border .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#ff6b9d}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:center;justify-content:center;display:none}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:18px;font-weight:700}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#888;padding:4px}
.modal-close:hover{color:#333}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid #f0f0f0}

/* NEW TICKET */
.ticket-steps{display:flex;gap:0;margin-bottom:24px;background:#f0f2f5;border-radius:10px;padding:4px}
.ticket-step{flex:1;text-align:center;padding:10px;border-radius:8px;font-size:13px;font-weight:600;color:#888;cursor:pointer}
.ticket-step.active{background:#ff6b9d;color:#fff}
.ticket-step.done{background:#dcfce7;color:#16a34a}

.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.service-btn{padding:14px 10px;border:2px solid #e0e0e0;border-radius:10px;background:#fff;cursor:pointer;text-align:center;transition:all .15s}
.service-btn:hover{border-color:#ff6b9d;background:#fff0f5}
.service-btn.selected{border-color:#ff6b9d;background:#ff6b9d;color:#fff}
.service-btn .svc-name{font-size:13px;font-weight:600}
.service-btn .svc-price{font-size:12px;margin-top:3px;opacity:.8}

.tech-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tech-btn{padding:14px 8px;border:2px solid #e0e0e0;border-radius:10px;background:#fff;cursor:pointer;text-align:center;transition:all .15s}
.tech-btn:hover{border-color:#4d7cfe}
.tech-btn.selected{border-color:#4d7cfe;background:#4d7cfe;color:#fff}
.tech-btn .tech-avatar{width:36px;height:36px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.tech-btn .tech-name{font-size:12px;font-weight:600}

.ticket-summary{background:#f8f9fb;border-radius:10px;padding:16px}
.ticket-line{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
.ticket-line.total{font-size:18px;font-weight:700;border-top:2px solid #e0e0e0;margin-top:8px;padding-top:12px}
.ticket-line.subtotal{color:#666}

.payment-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.pay-btn{padding:16px;border:2px solid #e0e0e0;border-radius:10px;background:#fff;cursor:pointer;text-align:center;transition:all .15s}
.pay-btn:hover{border-color:#22c55e}
.pay-btn.selected{border-color:#22c55e;background:#22c55e;color:#fff}
.pay-btn .pay-icon{font-size:24px;margin-bottom:6px}
.pay-btn .pay-label{font-size:13px;font-weight:600}

.tip-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tip-btn{padding:8px 16px;border:2px solid #e0e0e0;border-radius:8px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.tip-btn:hover{border-color:#f97316}
.tip-btn.selected{background:#f97316;border-color:#f97316;color:#fff}

/* QUICK ACTION BAR */
.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.qa-btn{background:#fff;border:none;border-radius:12px;padding:16px;cursor:pointer;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:all .15s}
.qa-btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.qa-btn .qa-icon{font-size:28px;margin-bottom:8px}
.qa-btn .qa-label{font-size:13px;font-weight:600;color:#333}

/* SEARCH */
.search-bar{display:flex;gap:10px;margin-bottom:16px}
.search-bar input{flex:1;padding:9px 14px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none}
.search-bar input:focus{border-color:#ff6b9d}

/* CUSTOMER PROFILE */
.profile-header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.profile-avatar{width:60px;height:60px;border-radius:50%;background:#ff6b9d;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:700}
.profile-info h2{font-size:18px;font-weight:700}
.profile-info p{font-size:13px;color:#888}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.profile-stat{background:#f8f9fb;border-radius:8px;padding:12px;text-align:center}
.profile-stat .ps-val{font-size:20px;font-weight:700;color:#ff6b9d}
.profile-stat .ps-lbl{font-size:11px;color:#888}

/* REPORTS */
.report-tabs{display:flex;gap:8px;margin-bottom:20px}
.rtab{padding:8px 18px;border-radius:8px;border:none;background:#f0f2f5;font-size:13px;font-weight:600;color:#666;cursor:pointer}
.rtab.active{background:#ff6b9d;color:#fff}
.report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}

/* APPOINTMENTS */
.appt-list{display:flex;flex-direction:column;gap:10px}
.appt-card{background:#fff;border-radius:10px;padding:14px;border-left:4px solid #ff6b9d;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.appt-card .appt-time{font-size:12px;color:#888;margin-bottom:4px}
.appt-card .appt-name{font-size:15px;font-weight:600}
.appt-card .appt-detail{font-size:13px;color:#666;margin-top:4px}

/* APPOINTMENTS — day calendar grid */
.appt-col{position:relative;border-left:1px solid #f0f0f0;cursor:pointer}
.appt-hourline{border-top:1px solid #f5f5f5;box-sizing:border-box;pointer-events:none}
.appt-hourline:first-child{border-top:none}
.appt-block{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 6px;font-size:11px;line-height:1.35;overflow:hidden;cursor:pointer;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:box-shadow .15s,z-index .15s}
.appt-block:hover{box-shadow:0 3px 10px rgba(0,0,0,.3);z-index:5}
.appt-block.cancelled{opacity:.45;text-decoration:line-through}

/* CHECKIN PANEL */
.checkin-board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.checkin-card{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06);border-top:3px solid #e0e0e0}
.checkin-card.waiting{border-top-color:#f97316}
.checkin-card.serving{border-top-color:#22c55e}
.checkin-card .cc-name{font-size:14px;font-weight:600;margin-bottom:4px}
.checkin-card .cc-time{font-size:11px;color:#888}
.checkin-card .cc-svc{font-size:12px;color:#666;margin-top:4px}
.checkin-card .cc-actions{display:flex;gap:6px;margin-top:10px;justify-content:center}

/* SETTINGS */
.settings-section{margin-bottom:24px}
.settings-section h3{font-size:15px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f0f0f0}
.service-item{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid #f0f0f0;border-radius:8px;margin-bottom:8px;background:#fff}
.service-item .si-name{flex:1;font-size:14px;font-weight:500}
.service-item .si-price{font-size:14px;font-weight:700;color:#22c55e;min-width:60px;text-align:right}
.service-item .si-cat{font-size:11px;color:#888}
.tech-item{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid #f0f0f0;border-radius:8px;margin-bottom:8px;background:#fff}
.tech-color{width:32px;height:32px;border-radius:50%;flex-shrink:0}
.tech-item .ti-name{flex:1;font-size:14px;font-weight:600}

/* RECEIPT */
.receipt{background:#fff;border-radius:12px;padding:24px;text-align:center;max-width:320px;margin:0 auto}
.receipt h2{font-size:20px;font-weight:700;margin-bottom:4px}
.receipt .r-sub{color:#888;font-size:13px;margin-bottom:20px}
.receipt-line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid #f5f5f5}
.receipt-total{display:flex;justify-content:space-between;padding:12px 0;font-size:18px;font-weight:700}
.receipt-check{font-size:48px;margin-bottom:12px;color:#22c55e}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#f0f2f5}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:10px}

/* PRINT RECEIPT */
@media print{
  body>*{display:none!important}
  #print-receipt{display:block!important;position:absolute;top:0;left:0;width:72mm;background:#fff;padding:4mm 4mm;font-family:'Segoe UI',Arial,sans-serif;font-size:11pt;color:#000}
  #print-receipt *{color:#000!important}
  #print-receipt .receipt-sig-line{border-top:1.5px solid #000;margin-top:2mm;margin-bottom:1mm}
  @page{size:80mm auto;margin:0}
}
#print-receipt{display:none}

/* CATEGORY FILTER */
.cat-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cat-pill{padding:6px 14px;border-radius:20px;border:1.5px solid #e0e0e0;background:#fff;font-size:12px;font-weight:600;cursor:pointer;color:#666}
.cat-pill.active{background:#ff6b9d;border-color:#ff6b9d;color:#fff}

.empty-state{text-align:center;padding:40px;color:#aaa}
.empty-state .es-icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px}

#toast{position:fixed;bottom:24px;right:24px;background:#1a1a2e;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}

.color-swatch{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle;margin-right:6px}
</style>
</head>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="logo">💅 NailPOS<span id="salonNameDisplay">My Nail Salon</span></div>
  <nav>

    <a onclick="showPage('reports')" id="nav-reports"><span class="icon">📊</span> Reports</a>
    <a onclick="showPage('giftcards')" id="nav-giftcards"><span class="icon">🎁</span> Gift Cards</a>
    <a onclick="showPage('marketing')" id="nav-marketing"><span class="icon">📣</span> Marketing</a>

  </nav>
  <div class="bottom" id="sidebarDate"></div>
  <a href="checkin.html" target="_blank" style="display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:14px;color:#8888aa;text-decoration:none;border-top:1px solid #2d2d4e;flex-shrink:0" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#8888aa'"><span style="font-size:18px;width:20px;text-align:center">📱</span> Customer Kiosk ↗</a>

<!-- MAIN -->
<div id="main">
  <div id="topbar">

      <div class="time" id="liveClock"></div>

<!-- MODALS -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>

<script>
// ===================== DATA STORE =====================
const _isServer = location.protocol !== 'file:';
const DB = {
  get(k){try{return JSON.parse(localStorage.getItem('npos_'+k))||null}catch{return null}},
  set(k,v){
    localStorage.setItem('npos_'+k,JSON.stringify(v));
    if(_isServer) DB._scheduleSave();
  },
  _saveTimer:null,
  _scheduleSave(){
    clearTimeout(DB._saveTimer);
    DB._saveTimer=setTimeout(DB._save,300);
  },
  // Keys the server manages directly via their own REST endpoints (not the generic
  // full-blob sync) — must never be echoed back through DB._save() or they'll clobber
  // whatever the dedicated endpoint just wrote (e.g. deleting a web booking, then a
  // debounced DB.set() save re-uploading a stale cached copy of the pending list).
  _serverOwnedKeys:['npos_web_bookings'],
  _save(){
    const data={};
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('npos_')&&!DB._serverOwnedKeys.includes(k)) data[k]=localStorage.getItem(k);
    }
    fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).catch(()=>{});
  },
  async load(){
    if(!_isServer) return;
    try{
      const res=await fetch('/api/db');
      const data=await res.json();
      for(const [k,v] of Object.entries(data)){
        if(k.startsWith('npos_')&&!DB._serverOwnedKeys.includes(k)) localStorage.setItem(k,v);
      }
      document.getElementById('syncStatus').textContent='🟢 Live';
    }catch{
      document.getElementById('syncStatus').textContent='🔴 Offline';
    }
  },
  // Poll for changes from other devices (e.g. kiosk check-ins)
  startPolling(onUpdate){
    if(!_isServer) return;
    setInterval(async()=>{
      try{
        const res=await fetch('/api/db?t='+Date.now());
        const data=await res.json();
        let changed=false;
        for(const [k,v] of Object.entries(data)){
          if(k.startsWith('npos_')&&!DB._serverOwnedKeys.includes(k)&&localStorage.getItem(k)!==v){
            localStorage.setItem(k,v);changed=true;
          }
        }
        if(changed&&onUpdate) onUpdate();
        document.getElementById('syncStatus').textContent='🟢 Live';
      }catch{
        document.getElementById('syncStatus').textContent='🔴 Offline';
      }
    },4000);
  }
};

function initData(){
  // One-time cleanup: this key used to get mirrored into localStorage and echoed back
  // via the full-blob save, clobbering server-side booking deletes. It's server-owned now.
  localStorage.removeItem('npos_web_bookings');
  if(!DB.get('settings')) DB.set('settings',{salonName:'My Nail Salon',taxRate:0,tipDefault:[15,18,20,25]});
  if(!DB.get('technicians')) DB.set('technicians',[
    {id:1,name:'Tiffany',color:'#ff6b9d',active:true,commission:0.5},
    {id:2,name:'Jenny',color:'#4d7cfe',active:true,commission:0.5},
    {id:3,name:'Linda',color:'#22c55e',active:true,commission:0.5},
    {id:4,name:'Kevin',color:'#f97316',active:true,commission:0.5},
    {id:5,name:'Amy',color:'#a855f7',active:true,commission:0.5},
  ]);
  if(!DB.get('services')||DB.get('services').length<13) DB.set('services',[
    {id:1001,name:'Manicure',price:20,category:'Manicure',duration:30},
    {id:1002,name:'Gel Manicure',price:35,category:'Manicure',duration:45},
    {id:1003,name:'Dip Powder',price:40,category:'Manicure',duration:50},
    {id:1004,name:'French Manicure',price:25,category:'Manicure',duration:35},
    {id:1005,name:'Pedicure',price:35,category:'Pedicure',duration:45},
    {id:1006,name:'Gel Pedicure',price:50,category:'Pedicure',duration:60},
    {id:1007,name:'Deluxe Pedicure',price:55,category:'Pedicure',duration:70},
    {id:1008,name:'Acrylic Full Set',price:50,category:'Acrylic',duration:75},
    {id:1009,name:'Acrylic Fill',price:35,category:'Acrylic',duration:45},
    {id:1010,name:'Acrylic with Gel',price:60,category:'Acrylic',duration:80},
    {id:1011,name:'Mani + Pedi Combo',price:50,category:'Combo',duration:75},
    {id:1012,name:'Gel Mani + Pedi',price:75,category:'Combo',duration:90},
    {id:1013,name:'Nail Art (per nail)',price:5,category:'Add-On',duration:10},
    {id:1014,name:'Paraffin Wax',price:10,category:'Add-On',duration:15},
    {id:1015,name:'French Tip',price:10,category:'Add-On',duration:10},

// ===================== HELPERS =====================
function genId(){return Date.now()+Math.floor(Math.random()*1000)}
function fmt(n){return '$'+Number(n).toFixed(2)}
function today(){return new Date().toISOString().split('T')[0]}
function fmtDate(d){if(!d)return '';const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function fmtTime(ts){return new Date(ts).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}
function initials(name){return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function loyaltyOn(){return !!((DB.get('settings')||{}).loyaltyEnabled)}
function toast(msg,dur=2500){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur)}

function showModal(title,body){
  document.getElementById('modalBox').style.width='';
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}

const pageTitles={dashboard:'Dashboard',checkin:'Check-In Board',newticket:'New Ticket',tickets:'Tickets',appointments:'Appointments',customers:'Customers',technicians:'Technicians',reports:'Reports',giftcards:'Gift Cards',marketing:'Marketing',settings:'Settings'};
const AREA_PROTECTED_PAGES=['settings','marketing','reports'];

function showPage(page){
  clearTimeout(_ticketFieldRenderTimer); // cancel any pending debounced tip/discount re-render from the ticket wizard
  if(AREA_PROTECTED_PAGES.includes(page)&&!window._areaUnlocked){
    const s=DB.get('settings')||{};
    if(s.areaPassword){
      showAreaPasswordModal(page);
      return;
    }
  }
  document.querySelectorAll('#sidebar nav a').forEach(a=>a.classList.remove('active'));
  const el=document.getElementById('nav-'+page);
  if(el)el.classList.add('active');
  document.getElementById('pageTitle').textContent=pageTitles[page]||page;
  const fns={dashboard:renderDashboard,checkin:renderCheckin,newticket:renderNewTicket,tickets:renderTickets,appointments:renderAppointments,customers:renderCustomers,technicians:renderTechnicians,reports:renderReports,giftcards:renderGiftCards,marketing:renderMarketing,settings:renderSettings};
  if(fns[page])fns[page]();
}

function showAreaPasswordModal(targetPage){
  showModal('🔒 Enter Security Password',`
    <p style="color:#888;font-size:13px;margin-bottom:14px">This area is password-protected. Enter the security password to continue.</p>
    <div class="form-group">
      <input id="areaPwInput" type="password" autocomplete="off" placeholder="Security password"
        style="font-size:16px;padding:10px 14px;border:2px solid #e0e0e0;border-radius:10px;width:100%;box-sizing:border-box;outline:none"
        onkeydown="if(event.key==='Enter'){event.preventDefault();checkAreaPassword('${targetPage}')}">
    </div>
    <div id="areaPwError" style="color:#ef4444;font-size:12px;min-height:16px;margin-top:2px"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="checkAreaPassword('${targetPage}')">Unlock</button>
    </div>`);
  setTimeout(()=>document.getElementById('areaPwInput')?.focus(),100);
}

function checkAreaPassword(targetPage){
  const s=DB.get('settings')||{};
  const input=document.getElementById('areaPwInput');
  const val=(input?input.value:'').trim();
  if(val&&val===(s.areaPassword||'')){
    window._areaUnlocked=true;
    closeModal();
    showPage(targetPage);
  } else {
    const err=document.getElementById('areaPwError');
    if(err)err.textContent='Incorrect password';
    if(input){input.value='';input.focus();}
  }
}

function renderCheckin(){
  // Purge checkins from previous days or already done — keep DB clean
  const allCheckins=DB.get('checkins')||[];
  const active=allCheckins.filter(c=>c.date===today()&&c.status!=='done'&&c.status!=='paid');
  if(active.length!==allCheckins.length) DB.set('checkins',active);

  const customers=DB.get('customers')||[];
  const techs=DB.get('technicians')||[];
  const waiting=active.filter(c=>c.status==='waiting');
  const serving=active.filter(c=>c.status==='serving');

  const mkCard=(c,status)=>{
    const cust=customers.find(x=>x.id===c.customerId);
    const tech=techs.find(x=>x.id===c.techId);
    const techLabel=c.techId===0?'Any technician':(tech?tech.name:null);
    const name=cust?cust.name:c.walkInName||'Walk-in';
    const mins=Math.floor((Date.now()-c.checkInTime)/60000);
    return `<div class="checkin-card ${status}">
      <div style="font-size:24px">${status==='waiting'?'⏳':'💆'}</div>
      <div class="cc-name">${name}</div>
      <div class="cc-time">${mins}m ago • ${fmtTime(c.checkInTime)}</div>
      <div class="cc-svc">${c.services||'Services TBD'}</div>
      ${techLabel?`<div class="cc-svc" style="color:#4d7cfe">→ ${techLabel}</div>`:''}
      <div class="cc-actions">
        ${status==='waiting'
          ?`<button class="btn btn-success btn-sm" onclick="showServeTechModal(${c.id})">Serve</button>`
          :`<button class="btn btn-primary btn-sm" onclick="checkinToTicket(${c.id})">✓ Checkout</button>`}
        <button class="btn btn-secondary btn-sm" onclick="removeCheckin(${c.id})">✕</button>
      </div>
    </div>`;
  };

  document.getElementById('content').innerHTML=`
    <div style="display:flex;gap:10px;margin-bottom:20px">
      <button class="btn btn-primary" onclick="showCheckinModal()">+ Check-In / Walk-In</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div>
        <div class="card-title" style="margin-bottom:12px">⏳ Waiting (${waiting.length})</div>
        <div class="checkin-board" style="grid-template-columns:repeat(2,1fr)">
          ${waiting.length?waiting.map(c=>mkCard(c,'waiting')).join(''):'<div style="color:#aaa;font-size:13px;padding:20px">No one waiting</div>'}
        </div>
      </div>
      <div>
        <div class="card-title" style="margin-bottom:12px">💆 Serving (${serving.length})</div>
        <div class="checkin-board" style="grid-template-columns:repeat(2,1fr)">
          ${serving.length?serving.map(c=>mkCard(c,'serving')).join(''):'<div style="color:#aaa;font-size:13px;padding:20px">No one being served</div>'}
        </div>
      </div>
    </div>`;
}

  const customers=DB.get('customers')||[];
  const phone=q.replace(/\D/g,'');
  const matches=customers.filter(c=>{
    const cp=c.phone.replace(/\D/g,'');
    return (phone&&cp.startsWith(phone))||c.name.toLowerCase().includes(q.toLowerCase());
  }).slice(0,8);
  if(matches.length){
    results.innerHTML=matches.map(c=>`
      <div onclick="_ciSelectCustomer(${c.id},'${c.name.replace(/'/g,"\\'")}','${c.phone}')"

      </div>`).join('');

      <div onclick="_ciSelectWalkIn('${q.replace(/'/g,"\\'")}')"

function doCheckin(){
  const svc=document.getElementById('ci_svc')?.value||'';

  // Resolve customer — could be existing, new (to save), or anonymous walk-in
  let finalCustomerId=_ciState.customerId||null;
  let finalName=_ciState.customerName||'Walk-in';
  let savedToDb=false;

  if(_ciState.isNew){
    // Read live values from the inline form
    const nameVal=(document.getElementById('ci_new_name')?.value||'').trim();
    const phoneVal=(document.getElementById('ci_new_phone')?.value||'').replace(/\D/g,'');
    finalName=nameVal||_ciState._name||'Walk-in';

    if(phoneVal.length===10){
      // Exactly 10 digits — save to DB
      const customers=DB.get('customers')||[];
      let existing=customers.find(c=>c.phone.replace(/\D/g,'')===phoneVal);
      if(existing){
        // Phone already exists — link to existing profile
        finalCustomerId=existing.id;
        finalName=existing.name;
      } else {
        // New customer — save with name (or "Walk-in" if no name given)
        const newCust={id:genId(),name:finalName||'Walk-in',phone:phoneVal,email:'',points:0,visits:0,totalSpent:0,birthday:'',lastVisit:today(),notes:''};
        customers.push(newCust);
        DB.set('customers',customers);
        finalCustomerId=newCust.id;
        savedToDb=true;
      }
    }
    // No phone or less than 10 digits → pure walk-in, nothing saved to DB
  }

  if(!finalName){
    const q=(document.getElementById('ci_search')?.value||'').trim();

// Shared validation for every Email/DOB field across the kiosk, staff check-in, and admin
// customer forms. Looks for a sibling error node at `${fieldId}_err`. Both fields are optional —
// an empty value is always valid; only a non-empty, malformed value is flagged.
function _custValidateEmail(fieldId){
  const el=document.getElementById(fieldId);
  if(!el)return true;
  const val=el.value.trim();
  const errEl=document.getElementById(fieldId+'_err');
  if(!val){if(errEl)errEl.textContent='';return true;}
  const ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
  if(errEl)errEl.textContent=ok?'':'Please enter a valid email address';
  return ok;
}
function _custValidateDob(fieldId){
  const el=document.getElementById(fieldId);
  if(!el)return true;
  const errEl=document.getElementById(fieldId+'_err');
  if(!el.value){if(errEl)errEl.textContent='';return true;}
  const ok=el.value<=today();
  if(errEl)errEl.textContent=ok?'':'Date of birth must be in the past';
  return ok;
}

async function gcLookup(){
  const code=ticketState.gcCode.trim();
  if(!code){toast('Enter a card code');return;}
  try{
    const res=await fetch('/api/giftcard?code='+encodeURIComponent(code));
    const data=await res.json();
    if(!res.ok){toast(data.error||'Card not found');ticketState.gcBalance=null;ticketState.gcApplied=0;renderTicketStep();return;}
    if(data.status==='USED'){toast('This card has no remaining balance');ticketState.gcBalance=0;ticketState.gcApplied=0;renderTicketStep();return;}
    ticketState.gcCode=data.gc_code;
    ticketState.gcBalance=data.balance;
    const subtotal=ticketState.services.reduce((s,x)=>s+x.price,0);
    const settings=DB.get('settings')||{};
    const tax=(subtotal*(settings.taxRate||0)/100);
    const discount=parseFloat(ticketState.discount)||0;
    const total=Math.max(0,subtotal-discount+tax+ticketState.tipAmt);
    ticketState.gcApplied=parseFloat(Math.min(data.balance,total).toFixed(2));
    renderTicketStep();
  }catch{toast('Server not reachable — start the server first');}
}

function setTip(amt){ticketState.tipAmt=amt;ticketState.customTip=amt>0?amt.toFixed(2):'';renderTicketStep();}

// Typing a multi-digit number into tip/discount fields triggers a full re-render on
// every keystroke, which resets the input and drops keystrokes. Debounce the re-render
// (not the underlying state, which stays accurate immediately) so it only redraws 1.5s
// after the user stops typing, giving them time to finish the number.
let _ticketFieldRenderTimer=null;
function _debounceRenderTicketStep(){
  clearTimeout(_ticketFieldRenderTimer);
  _ticketFieldRenderTimer=setTimeout(renderTicketStep,1500);
}

function setCustomTip(val){
  ticketState.tipAmt=parseFloat(val)||0;
  ticketState.customTip=val;
  _debounceRenderTicketStep();
}

function setDiscountAmt(val){
  ticketState.discount=parseFloat(val)||0;
  _debounceRenderTicketStep();
}

function setDiscountMode(mode){
  ticketState.discountMode=mode;
  if(mode==='dollar'){
    ticketState.discountPct=0;
  } else {
    const subtotal=ticketState.services.reduce((s,x)=>s+x.price,0);
    ticketState.discount=parseFloat((subtotal*(ticketState.discountPct||0)/100).toFixed(2));
  }
  renderTicketStep();
}

function setDiscountPct(val){
  const pct=Math.max(0,Math.min(100,parseFloat(val)||0));
  ticketState.discountPct=pct;
  const subtotal=ticketState.services.reduce((s,x)=>s+x.price,0);
  ticketState.discount=parseFloat((subtotal*pct/100).toFixed(2));
  _debounceRenderTicketStep();
}

async function completeTicket(){
  clearTimeout(_ticketFieldRenderTimer); // values are already captured below; no need for the deferred re-render to fire later
  const subtotal=ticketState.services.reduce((s,x)=>s+x.price,0);
  const settings=DB.get('settings')||{};
  const tax=(subtotal*(settings.taxRate||0)/100);
  const discount=parseFloat(ticketState.discount)||0;
  const total=Math.max(0,subtotal-discount+tax+ticketState.tipAmt);
  const ticketId=genId();
  const ticketNo='#'+String(ticketId).slice(-6).toUpperCase();

  // Gift card charge — must succeed before saving ticket
  let gcApplied=0,gcRemainMethod='';
  if(ticketState.payMethod==='giftcard'){
    if(ticketState.gcManual){
      // Manual mode — no DB lookup, just record the amount staff entered
      gcApplied=parseFloat((ticketState.gcApplied||total).toFixed(2));
      if(gcApplied<=0){toast('Enter the gift card amount');return;}
      gcRemainMethod=total-gcApplied>0.005?ticketState.gcRemainMethod:'';
    } else {
      if(!ticketState.gcCode||ticketState.gcBalance===null){toast('Look up a gift card first');return;}
      const chargeAmt=parseFloat((ticketState.gcApplied||0).toFixed(2));
      if(chargeAmt<=0){toast('Gift card amount must be greater than $0');return;}
      try{
        const res=await fetch('/api/giftcard/charge',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({code:ticketState.gcCode,amount:chargeAmt,ticket_no:ticketNo})});
        const data=await res.json();
        if(!res.ok){toast('Gift card error: '+(data.error||'failed'));return;}
        gcApplied=chargeAmt;
        gcRemainMethod=total-chargeAmt>0.005?ticketState.gcRemainMethod:'';
        toast(`Gift card charged ${fmt(chargeAmt)} — remaining balance: ${fmt(data.balance_after)}`);
      }catch{toast('Server not reachable');return;}
    }
  }

  const gcTag=ticketState.gcManual?'giftcard-manual':'giftcard';
  const payLabel=ticketState.payMethod==='giftcard'
    ?(gcRemainMethod?`${gcTag}+${gcRemainMethod}`:gcTag)
    :ticketState.payMethod;

  const ticket={
    id:ticketId,date:today(),timestamp:Date.now(),
    customerId:ticketState.customerId,customerName:ticketState.customerName,
    techId:ticketState.techId,
    services:ticketState.services.map(s=>({id:s.id,name:s.name,price:s.price})),
    subtotal,tax,discount,discountLabel:discount?ticketState.discountLabel:'',tip:ticketState.tipAmt,
    payMethod:payLabel,
    gcCode:gcApplied?ticketState.gcCode:'',
    gcApplied,
    total,status:'paid'
  };

  const tickets=DB.get('tickets')||[];
  tickets.push(ticket);DB.set('tickets',tickets);

  // Audit log: technician was reassigned after check-in
  if(ticketState._checkinTechId!=null&&ticketState.techId!==ticketState._checkinTechId){
    const log=DB.get('techChangeLog')||[];
    log.push({
      id:genId(),ticketId:ticket.id,checkinId:ticketState._checkinId,
      fromTechId:ticketState._checkinTechId,toTechId:ticketState.techId,
      changedBy:(ticketState._changedBy||'').trim()||'Unknown',changedAt:Date.now()
    });
    DB.set('techChangeLog',log);
  }

  // Update customer stats
  if(ticketState.customerId){
    const customers=DB.get('customers')||[];
    const c=customers.find(x=>x.id===ticketState.customerId);
    if(c){
      c.visits=(c.visits||0)+1;
      c.totalSpent=(c.totalSpent||0)+total;
      if(loyaltyOn()) c.points=(c.points||0)+Math.floor(total);
      c.lastVisit=today();
      DB.set('customers',customers);
    }
  }

  // Mark checkin as done (don't just delete — marking prevents re-sync from resurrecting it)
  const checkins=DB.get('checkins')||[];
  if(ticketState._checkinId){
    const ci=checkins.find(c=>c.id===ticketState._checkinId);
    if(ci) ci.status='done';
  } else if(ticketState.customerId){
    checkins.filter(c=>c.customerId===ticketState.customerId&&c.date===today()).forEach(c=>c.status='done');
  }
  DB.set('checkins',checkins);

  // Push approved state to customer display
  const _ts = DB.get('settings')||{};
  syncDisplay('approved', {
    total: ticket.total,
    authCode: (ticketState._terminalAuth||{}).authCode||'',
    cardType: (ticketState._terminalAuth||{}).cardType||'',
    last4:    (ticketState._terminalAuth||{}).last4||'',
    pointsEarned: loyaltyOn() ? Math.floor(ticket.subtotal) : 0,
    settings: {receiptThankyou: _ts.receiptThankyou||'Thank you for your visit!'},
    salonName: _ts.salonName||'Nail Salon',
  });
  // Reset display to idle after 8 seconds
  setTimeout(()=>syncDisplay('idle'), 8000);

  showReceiptModal(ticket);
  if(_ts.autoPrintSale!==false) setTimeout(()=>printReceipt(ticket.id), 300);
}

function buildReceiptEmailBody(ticket){
  const tech=(DB.get('technicians')||[]).find(t=>t.id===ticket.techId);
  const settings=DB.get('settings')||{};
  const salonName=settings.salonName||'Nail Salon';
  const dateStr=new Date(ticket.timestamp||Date.now()).toLocaleString('en-US',{month:'long',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const ticketNum='#'+String(ticket.id).slice(-6).toUpperCase();
  let body=`Hi ${ticket.customerName},\n\nThank you for visiting ${salonName}! Here is your receipt:\n\n`;
  body+=`Date: ${dateStr}\nTicket: ${ticketNum}\nTechnician: ${tech?tech.name:'—'}\nPayment: ${ticket.payMethod.toUpperCase()}\n`;
  if(ticket.gcCode)body+=`Gift Card: ${ticket.gcCode}\n`;
  body+=`\n`;
  body+=`SERVICES\n`+('─'.repeat(30))+'\n';
  ticket.services.forEach(s=>{body+=`${s.name.padEnd(24)}${fmt(s.price)}\n`;});
  body+=('─'.repeat(30))+'\n';
  if(ticket.discount)body+=`${('Discount'+(ticket.discountLabel?` (${ticket.discountLabel})`:'')).padEnd(24)}-${fmt(ticket.discount)}\n`;
  if(ticket.tax)body+=`${'Tax'.padEnd(24)}${fmt(ticket.tax)}\n`;
  body+=`${'Tip'.padEnd(24)}${fmt(ticket.tip||0)}\n`;
  body+=('─'.repeat(30))+'\n';
  body+=`${'TOTAL'.padEnd(24)}${fmt(ticket.total)}\n\n`;
  body+=`We appreciate your business and look forward to seeing you again!\n\n${salonName}`;
  return body;
}

function sendReceiptEmail(ticketId){
  const tickets=DB.get('tickets')||[];
  const ticket=tickets.find(t=>t.id===ticketId);
  if(!ticket)return;
  const emailEl=document.getElementById('rcpt_email');
  const email=emailEl?emailEl.value.trim():'';
  if(!email||!email.includes('@')){toast('Enter a valid email address');return;}

  // Save email to customer profile
  if(ticket.customerId){
    const customers=DB.get('customers')||[];
    const c=customers.find(x=>x.id===ticket.customerId);

  }

  toast('Email client opened!');
}

async function voidTicket(id){
  const tickets=DB.get('tickets')||[];
  const t=tickets.find(x=>x.id===id);
  if(!t)return;
  if(t.status==='voided'){toast('Already voided');return;}
  const label=`ticket #${String(t.id).slice(-6).toUpperCase()} — ${t.customerName} — ${fmt(t.total)}`;
  if(!confirm(`Void ${label}?\n\nThis reverses the customer's points/visit and marks the ticket as voided. It stays in history for your records.`))return;

  // Reverse customer stats for whatever portion hasn't already been refunded
  const remaining=Math.max(0,t.total-(t.refundedAmount||0));
  if(t.customerId){
    const customers=DB.get('customers')||[];
    const c=customers.find(x=>x.id===t.customerId);
    if(c){
      c.visits=Math.max(0,(c.visits||0)-1);
      c.totalSpent=Math.max(0,(c.totalSpent||0)-remaining);
      c.points=Math.max(0,(c.points||0)-Math.floor(remaining));
      DB.set('customers',customers);
    }
  }
  // Return any gift-card portion back onto the card it was charged from
  if(t.gcApplied>0&&t.gcCode){
    try{await fetch('/api/giftcard/refill',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:t.gcCode,amount:t.gcApplied})});}catch(e){}
  }

  t.status='voided';
  t.voidedAt=Date.now();
  DB.set('tickets',tickets);
  _refreshActiveView(id);
  toast('Ticket voided');

  const settings=DB.get('settings')||{};
  if(settings.autoPrintCancel!==false)setTimeout(()=>printTicketEvent(id,'void'),300);
}

function refundTicket(id){
  const tickets=DB.get('tickets')||[];
  const t=tickets.find(x=>x.id===id);
  if(!t)return;
  if(t.status==='voided'){toast('This ticket was voided, not refunded');return;}
  const remaining=Math.max(0,t.total-(t.refundedAmount||0));
  if(remaining<=0){toast('Ticket is already fully refunded');return;}
  showModal('Refund Ticket #'+String(t.id).slice(-6).toUpperCase(),`
    <div class="form-group"><label>Refund Amount (max ${fmt(remaining)})</label>
      <input id="rf_amt" type="number" min="0.01" max="${remaining}" step="0.01" value="${remaining.toFixed(2)}" style="font-size:18px;font-weight:700"></div>
    <div class="form-group"><label>Reason (optional)</label>
      <input id="rf_reason" placeholder="e.g. Customer unsatisfied"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="applyRefund(${t.id})">Confirm Refund</button>
    </div>`);
}

function applyRefund(id){
  const tickets=DB.get('tickets')||[];
  const t=tickets.find(x=>x.id===id);
  if(!t)return;
  const remaining=Math.max(0,t.total-(t.refundedAmount||0));
  const amtEl=document.getElementById('rf_amt');
  const reasonEl=document.getElementById('rf_reason');
  const amount=parseFloat(amtEl?amtEl.value:0);
  if(isNaN(amount)||amount<=0||amount>remaining+0.001){toast('Enter a valid refund amount (up to '+fmt(remaining)+')');return;}
  const reason=(reasonEl?reasonEl.value:'').trim();

  if(t.customerId){
    const customers=DB.get('customers')||[];
    const c=customers.find(x=>x.id===t.customerId);
    if(c){
      c.totalSpent=Math.max(0,(c.totalSpent||0)-amount);
      c.points=Math.max(0,(c.points||0)-Math.floor(amount));
      DB.set('customers',customers);
    }
  }

  t.refundedAmount=Math.round(((t.refundedAmount||0)+amount)*100)/100;
  t.refunds=t.refunds||[];
  t.refunds.push({amount,reason,ts:Date.now()});
  t.status=t.refundedAmount>=t.total-0.005?'refunded':'partial-refund';
  DB.set('tickets',tickets);
  closeModal();
  _refreshActiveView(id);
  toast('Refunded '+fmt(amount));

  const settings=DB.get('settings')||{};
  if(settings.autoPrintRefund!==false)setTimeout(()=>printTicketEvent(id,'refund',amount),300);
}

function _apptDurationMin(appt){
  const catalog=DB.get('services')||[];
  const names=(appt.services||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  if(!names.length)return 30;
  let total=0,matched=0;
  names.forEach(n=>{
    const s=catalog.find(x=>x.name.toLowerCase()===n);
    if(s){total+=s.duration||30;matched++;}
  });
  return matched?Math.max(15,total):30;
}

// Side-by-side layout for overlapping appointments in the same column (e.g. an
// intentional double-booking): sweep left-to-right by start time, greedily assign
// each item the lowest free lane, and once a contiguous overlap cluster closes
// (no items active), stamp every item in it with that cluster's lane count.
function _apptComputeLanes(list){
  const items=list.slice().sort((a,b)=>a.startMin-b.startMin);
  const finalize=(from,to)=>{
    let maxLane=0;
    for(let i=from;i<to;i++)maxLane=Math.max(maxLane,items[i].lane);
    for(let i=from;i<to;i++)items[i].laneCount=maxLane+1;
  };
  let active=[],clusterStart=0;
  items.forEach((it,i)=>{
    active=active.filter(x=>x.endMin>it.startMin);
    if(active.length===0&&i>clusterStart){finalize(clusterStart,i);clusterStart=i;}
    const used=new Set(active.map(x=>x.lane));
    let lane=0;while(used.has(lane))lane++;
    it.lane=lane;
    active.push({endMin:it.endMin,lane});
  });
  if(items.length)finalize(clusterStart,items.length);
  return items;
}

function _apptColClick(e,dateStr,techId){
  if(e.target.closest('.appt-block'))return;
  const rect=e.currentTarget.getBoundingClientRect();
  const y=e.clientY-rect.top;
  const totalMinutes=(APPT_CLOSE_HOUR-APPT_OPEN_HOUR)*60;
  let minutesFromOpen=(y/rect.height)*totalMinutes;
  minutesFromOpen=Math.round(minutesFromOpen/15)*15;
  minutesFromOpen=Math.max(0,Math.min(totalMinutes-15,minutesFromOpen));
  const hour=APPT_OPEN_HOUR+Math.floor(minutesFromOpen/60);
  const min=minutesFromOpen%60;
  const timeStr=`${String(hour).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
  showAddApptModal(dateStr,timeStr,techId);
}

function renderApptDayGrid(){
  const dateStr=window._apptViewDate;
  const labelEl=document.getElementById('apptDateLabel');
  const pickerEl=document.getElementById('apptDatePicker');
  const dObj=new Date(dateStr+'T00:00:00');
  if(labelEl)labelEl.textContent=dObj.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',year:'numeric'});
  if(pickerEl)pickerEl.value=dateStr;

  const wrap=document.getElementById('apptGridWrap');
  if(!wrap)return;

  const techs=(DB.get('technicians')||[]).filter(t=>t.active);
  const columns=[...techs,{id:null,name:'Unassigned',color:'#9ca3af'}];
  const customers=DB.get('customers')||[];
  const appts=(DB.get('appointments')||[]).filter(a=>(a.datetime||'').slice(0,10)===dateStr);

  const hours=APPT_CLOSE_HOUR-APPT_OPEN_HOUR;
  const totalHeight=hours*APPT_ROW_H;
  const hourLines=Array.from({length:hours},()=>`<div class="appt-hourline" style="height:${APPT_ROW_H}px"></div>`).join('');
  const hourGutter=Array.from({length:hours},(_,i)=>{
    const h=APPT_OPEN_HOUR+i;
    const label=h===0?'12 AM':h<12?`${h} AM`:h===12?'12 PM':`${h-12} PM`;
    return `<div style="height:${APPT_ROW_H}px;position:relative"><span style="position:absolute;top:-7px;right:8px;font-size:11px;color:#aaa;background:#f7f7f9;padding:0 2px">${label}</span></div>`;
  }).join('');

  const colsHtml=columns.map(col=>{
    const colAppts=appts.filter(a=>(a.techId||null)===col.id);
    const laneItems=colAppts.map(a=>{
      const dt=new Date(a.datetime);
      let startMin=(dt.getHours()-APPT_OPEN_HOUR)*60+dt.getMinutes();
      startMin=Math.max(0,Math.min(hours*60,startMin));
      const endMin=Math.min(hours*60,startMin+_apptDurationMin(a));
      return {a,startMin,endMin};
    });
    const laned=_apptComputeLanes(laneItems);
    const blocks=laned.map(({a,startMin,endMin,lane,laneCount})=>{
      const top=(startMin/60)*APPT_ROW_H;
      const height=Math.max(20,((endMin-startMin)/60)*APPT_ROW_H-2);
      const widthPct=100/laneCount;
      const leftPct=lane*widthPct;
      const c=customers.find(x=>x.id===a.customerId);
      const name=c?c.name:a.walkInName||'Unknown';
      const timeStr=new Date(a.datetime).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
      const isCancelled=a.status==='cancelled';
      return `<div class="appt-block${isCancelled?' cancelled':''}" style="top:${top}px;height:${height}px;left:calc(${leftPct}% + 2px);width:calc(${widthPct}% - 4px);right:auto;background:${col.color||'#ff6b9d'}" onclick="event.stopPropagation();showApptDetail(${a.id})" title="${name} — ${(a.services||'').replace(/"/g,'&quot;')}">
        <div style="font-weight:700">${timeStr}</div>
        <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</div>
      </div>`;
    }).join('');
    return `<div class="appt-col" style="height:${totalHeight}px" onclick="_apptColClick(event,'${dateStr}',${col.id===null?'null':col.id})">
      ${hourLines}
      ${blocks}
    </div>`;
  }).join('');

  const headerHtml=columns.map(col=>`<div style="text-align:center;font-size:12px;font-weight:700;padding:10px 4px;color:#444;display:flex;align-items:center;justify-content:center;gap:6px;border-left:1px solid #f0f0f0">${col.color?`<span class="color-swatch" style="background:${col.color}"></span>`:''}${col.name}</div>`).join('');

  wrap.innerHTML=`<div class="card" style="padding:0;overflow-x:auto">
    <div style="display:grid;grid-template-columns:60px repeat(${columns.length},minmax(140px,1fr));border-bottom:1.5px solid #eee;background:#f7f7f9">
      <div></div>
      ${headerHtml}
    </div>
    <div style="display:grid;grid-template-columns:60px repeat(${columns.length},minmax(140px,1fr));background:#f7f7f9">
      <div>${hourGutter}</div>
      ${colsHtml}
    </div>
  </div>`;
}

function markApptDone(id){

async function importWebBooking(id){
  // Fetch the booking details fresh from server
  let booking=null;
  try{
    const res=await fetch('/api/bookings');
    const all=await res.json();
    booking=all.find(b=>b.id===id);
  }catch{toast('Server not reachable');return;}
  if(!booking){toast('Booking not found');return;}

  // Find or create customer
  const customers=DB.get('customers')||[];
  let cust=customers.find(c=>c.phone===booking.phone);
  if(!cust){
    cust={id:genId(),name:booking.name,phone:booking.phone,email:booking.email||'',
          points:0,visits:0,totalSpent:0,birthday:'',lastVisit:'',notes:'',source:'website'};
    customers.push(cust);DB.set('customers',customers);
    toast(`New customer saved: ${booking.name}`);
  } else if(booking.email&&!cust.email){
    cust.email=booking.email;DB.set('customers',customers);
  }

  // Create appointment
  const appts=DB.get('appointments')||[];
  const timeStr=booking.time.replace(' AM','').replace(' PM','');
  const [h,m]=timeStr.split(':');
  let hour=parseInt(h);
  if(booking.time.includes('PM')&&hour!==12)hour+=12;
  if(booking.time.includes('AM')&&hour===12)hour=0;
  const pad=n=>String(n).padStart(2,'0');
  appts.push({
    id:genId(),
    customerId:cust.id,
    techId:null,
    datetime:`${booking.date}T${pad(hour)}:${pad(parseInt(m)||0)}`,
    services:booking.services,
    notes:booking.notes||'Booked via website',
    status:'confirmed',
    fromWebsite:true
  });
  DB.set('appointments',appts);

  // Remove from web bookings queue
  await fetch(`/api/bookings/${id}`,{method:'DELETE'}).catch(()=>{});

  renderAppointments();
  toast(`✓ Imported: ${booking.name} on ${booking.date}`);
}

// ── EXCEL IMPORT (removed from UI — customers pre-loaded) ────
function loadSheetJS(cb){
  if(window.XLSX){cb();return;}
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=cb;s.onerror=()=>toast('Could not load Excel parser. Check internet connection.');
  document.head.appendChild(s);
}

function handleImportFile(input){
  const file=input.files[0];if(!file)return;
  input.value='';
  loadSheetJS(()=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        let rows=[];
        if(file.name.endsWith('.csv')){
          // Parse CSV manually
          const text=e.target.result;
          const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
          const headers=lines[0].split(',').map(h=>h.replace(/"/g,'').trim().toLowerCase());
          for(let i=1;i<lines.length;i++){
            const vals=lines[i].match(/(".*?"|[^,]+|(?<=,)(?=,)|(?<=,)$)/g)||[];
            const row={};
            headers.forEach((h,j)=>row[h]=(vals[j]||'').replace(/"/g,'').trim());
            rows.push(row);
          }
        } else {
          const wb=XLSX.read(e.target.result,{type:'binary'});
          const ws=wb.Sheets[wb.SheetNames[0]];
          rows=XLSX.utils.sheet_to_json(ws,{defval:''});
          // Normalize headers to lowercase
          rows=rows.map(r=>{
            const n={};
            Object.keys(r).forEach(k=>n[k.toLowerCase().trim()]=String(r[k]).trim());
            return n;
          });
        }
        if(!rows.length){toast('No data found in file');return;}
        showImportPreview(rows);
      }catch(err){toast('Error reading file: '+err.message);}
    };
    if(file.name.endsWith('.csv')) reader.readAsText(file);
    else reader.readAsBinaryString(file);
  });
}

// Map common column name variants to our fields
const COL_MAP={
  name:['name','full name','fullname','customer name','customername','customer'],
  phone:['phone','phone number','phonenumber','mobile','cell','tel','telephone','contact'],
  email:['email','email address','emailaddress','e-mail'],
  birthday:['birthday','birth date','birthdate','dob','date of birth'],
  notes:['notes','note','preference','preferences','comments'],
  points:['points','reward points','rewardpoints'],
  visits:['visits','visit count','visitcount'],
};

function detectCol(headers,field){
  const aliases=COL_MAP[field]||[field];
  return headers.find(h=>aliases.includes(h.toLowerCase().trim()))||null;
}

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="runImport(${JSON.stringify(rows).split('"').join("'")})" id="runImportBtn">Import ${rows.length} Customers</button>
    </div>`);

  // Store rows on window to avoid escaping issues

function runImport(rows){
  const getCol=field=>document.getElementById('map_'+field).value;
  const nameCol=getCol('name');
  if(!nameCol){document.getElementById('importMsg').textContent='Please map the Name column.';return;}

  const phoneCol=getCol('phone'),emailCol=getCol('email'),bdCol=getCol('birthday'),
        ptCol=getCol('points'),notesCol=getCol('notes');

  const customers=DB.get('customers')||[];
  let added=0,skipped=0,updated=0;

  rows.forEach(r=>{
    const name=(r[nameCol]||'').trim();
    if(!name){skipped++;return;}
    const phone=(r[phoneCol]||'').replace(/\D/g,'');

    // Deduplicate by phone (if provided) or name
    let existing=phone?customers.find(c=>c.phone===phone):customers.find(c=>c.name.toLowerCase()===name.toLowerCase());

    if(existing){
      // Update missing fields only
      if(emailCol&&r[emailCol]&&!existing.email) existing.email=r[emailCol].trim();
      if(bdCol&&r[bdCol]&&!existing.birthday) existing.birthday=parseDate(r[bdCol]);
      if(notesCol&&r[notesCol]&&!existing.notes) existing.notes=r[notesCol].trim();
      if(ptCol&&r[ptCol]) existing.points=Math.max(existing.points||0,parseInt(r[ptCol])||0);
      updated++;
    } else {
      customers.push({
        id:genId(),
        name,
        phone,
        email:emailCol?r[emailCol].trim():'',
        birthday:bdCol?parseDate(r[bdCol]):'',
        points:ptCol?parseInt(r[ptCol])||0:0,
        visits:0,totalSpent:0,lastVisit:'',
        notes:notesCol?r[notesCol].trim():'',
        source:'import'
      });
      added++;
    }
  });

  DB.set('customers',customers);
  closeModal();
  renderCustomers();
  toast(`✓ Imported: ${added} new, ${updated} updated, ${skipped} skipped`);
}

function parseDate(val){
  if(!val)return'';
  // Try common date formats
  const s=String(val).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  const d=new Date(s);
  if(!isNaN(d))return d.toISOString().split('T')[0];
  // Excel serial date
  if(/^\d+$/.test(s)){
    const excelEpoch=new Date(1899,11,30);
    const d2=new Date(excelEpoch.getTime()+parseInt(s)*86400000);
    if(!isNaN(d2))return d2.toISOString().split('T')[0];
  }
  return'';
}

function saveEditCustomer(id){
  const name=document.getElementById('ec_name').value.trim();
  const phone=document.getElementById('ec_phone').value.replace(/\D/g,'');
  if(!name){toast('Name is required');return;}
  if(!_custValidateEmail('ec_email')||!_custValidateDob('ec_bday')){toast('Please fix the highlighted fields');return;}
  const customers=DB.get('customers')||[];
  // Check phone uniqueness (ignore self)
  if(phone&&customers.find(c=>c.phone===phone&&c.id!==id)){toast('Phone already used by another customer');return;}
  const c=customers.find(x=>x.id===id);if(!c)return;
  c.name=name;
  c.phone=phone;
  c.email=document.getElementById('ec_email').value.trim();
  c.birthday=document.getElementById('ec_bday').value;
  if(loyaltyOn()&&document.getElementById('ec_pts')) c.points=parseInt(document.getElementById('ec_pts').value)||0;
  c.notes=document.getElementById('ec_notes').value.trim();
  DB.set('customers',customers);
  closeModal();
  toast(`${name} updated!`);
  // Refresh whichever page is active
  if(document.getElementById('nav-customers').classList.contains('active'))renderCustomers();
}

function deleteCustomer(id){
  if(!confirm('Delete this customer? Their ticket history will remain.'))return;
  const customers=(DB.get('customers')||[]).filter(c=>c.id!==id);
  DB.set('customers',customers);
  closeModal();
  renderCustomers();
  toast('Customer deleted');
}

function quickSendReceipt(ticketId, existingEmail){
  const tickets=DB.get('tickets')||[];
  const ticket=tickets.find(t=>t.id===ticketId);
  if(!ticket)return;
  const email=existingEmail||prompt('Enter customer email:');
  if(!email||!email.includes('@')){toast('No email provided');return;}
  const settings=DB.get('settings')||{};
  const salonName=settings.salonName||'Nail Salon';
  const subject=encodeURIComponent(`Your Receipt from ${salonName}`);
  const body=encodeURIComponent(buildReceiptEmailBody(ticket));
  // Save email if not set
  if(ticket.customerId){
    const customers=DB.get('customers')||[];
    const c=customers.find(x=>x.id===ticket.customerId);
    if(c&&!c.email){c.email=email;DB.set('customers',customers);}
  }
  window.open(`mailto:${email}?subject=${subject}&body=${body}`,'_blank');
  toast('Email client opened!');
}

function sendAllHistory(customerId){
  const customers=DB.get('customers')||[];
  const c=customers.find(x=>x.id===customerId);
  if(!c)return;
  const email=c.email||prompt('Enter customer email:');
  if(!email||!email.includes('@')){toast('No email provided');return;}
  if(!c.email){c.email=email;DB.set('customers',customers);}
  const tickets=(DB.get('tickets')||[]).filter(t=>t.customerId===customerId).slice().reverse();
  if(!tickets.length){toast('No visit history');return;}
  const settings=DB.get('settings')||{};
  const salonName=settings.salonName||'Nail Salon';
  let body=`Hi ${c.name},\n\nHere is your complete visit history at ${salonName}:\n\n`;
  tickets.forEach((t,i)=>{
    const dt=new Date(t.timestamp||Date.now()).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    body+=`${i+1}. ${dt} — ${t.services.map(s=>s.name).join(', ')} — ${fmt(t.total)}\n`;
  });
  body+=`\nTotal Visits: ${tickets.length}\nTotal Spent: ${fmt(tickets.reduce((s,t)=>s+t.total,0))}\nReward Points: ${c.points}\n\nThank you for your continued business!\n${salonName}`;
  const subject=encodeURIComponent(`Your Visit History at ${salonName}`);
  window.open(`mailto:${email}?subject=${subject}&body=${encodeURIComponent(body)}`,'_blank');
  toast('Email client opened!');
}

// ===================== TECHNICIANS =====================
function renderTechnicians(){
  const techs=DB.get('technicians')||[];
  const tickets=DB.get('tickets')||[];
  const todayTickets=tickets.filter(t=>t.date===today());

  const rows=techs.map(t=>{
    const myTickets=todayTickets.filter(x=>x.techId===t.id);
    const rev=myTickets.reduce((s,x)=>s+x.subtotal,0);
    const tips=myTickets.reduce((s,x)=>s+(x.tip||0),0);
    const payout=rev*(t.commission||0.5);
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:10px">
        <div style="width:32px;height:32px;border-radius:50%;background:${t.color};color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">${initials(t.name)}</div>
        <span style="font-weight:600">${t.name}</span>
      </div></td>
      <td><span class="badge ${t.active?'badge-green':'badge-red'}">${t.active?'Active':'Inactive'}</span></td>
      <td>${myTickets.length}</td>
      <td>${fmt(rev)}</td>
      <td>${fmt(tips)}</td>
      <td>${(t.commission*100).toFixed(0)}%</td>
      <td style="font-weight:700;color:#22c55e">${fmt(payout)}</td>
      <td>
        <button class="btn btn-sm btn-outline" onclick="editTech(${t.id})">Edit</button>
        <button class="btn btn-sm btn-secondary" onclick="toggleTechActive(${t.id})">${t.active?'Deactivate':'Activate'}</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTech(${t.id})">🗑 Delete</button>
      </td>
    </tr>`;
  }).join('');

  const totalPayout=techs.reduce((s,t)=>{
    const r=todayTickets.filter(x=>x.techId===t.id).reduce((a,b)=>a+b.subtotal,0);
    return s+r*(t.commission||0.5);
  },0);

  document.getElementById('content').innerHTML=`
    <div style="display:flex;gap:10px;margin-bottom:20px">
      <button class="btn btn-primary" onclick="showAddTechModal()">+ Add Technician</button>
      <div class="stat-card green" style="flex:1;padding:12px 20px">
        <div class="label">Today's Total Payout</div>
        <div class="value" style="font-size:20px">${fmt(totalPayout)}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:16px">Technicians — Today's Performance</div>
      <table><thead><tr><th>Name</th><th>Status</th><th>Tickets</th><th>Revenue</th><th>Tips</th><th>Commission</th><th>Payout</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>`;
}

function showAddTechModal(t){
  const editing=!!t;
  showModal(editing?'Edit Technician':'Add Technician',`
    <div class="form-group"><label>Name *</label><input id="nt_name" value="${t?t.name:''}"></div>
    <div class="form-row">
      <div class="form-group"><label>Color</label><input id="nt_color" type="color" value="${t?t.color:'#ff6b9d'}" style="height:40px;width:100%"></div>
      <div class="form-group"><label>Commission %</label><input id="nt_comm" type="number" min="0" max="100" value="${t?t.commission*100:50}"></div>
    </div>
    <div class="form-group"><label>Staff PIN <span style="color:#aaa;font-weight:400">(4 digits — used to unlock the screen)</span></label>
      <input id="nt_pin" inputmode="numeric" maxlength="4" placeholder="e.g. 1234" value="${t?t.pin||'':''}" oninput="this.value=this.value.replace(/\D/g,'')"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTech(${t?t.id:0})">${editing?'Save':'Add'}</button>
    </div>`);

function saveTech(id){
  const name=document.getElementById('nt_name').value.trim();
  const color=document.getElementById('nt_color').value;
  const comm=parseFloat(document.getElementById('nt_comm').value)/100;
  const pin=(document.getElementById('nt_pin').value||'').trim();
  if(!name){toast('Name required');return;}
  if(pin&&pin.length!==4){toast('PIN must be exactly 4 digits');return;}
  const techs=DB.get('technicians')||[];
  if(id){const t=techs.find(x=>x.id===id);if(t){t.name=name;t.color=color;t.commission=comm;t.pin=pin;}}
  else techs.push({id:genId(),name,color,commission:comm,pin,active:true});
  DB.set('technicians',techs);closeModal();renderTechnicians();toast('Saved!');
}

function editTech(id){const t=(DB.get('technicians')||[]).find(x=>x.id===id);if(t)showAddTechModal(t);}
function toggleTechActive(id){const techs=DB.get('technicians')||[];const t=techs.find(x=>x.id===id);if(t)t.active=!t.active;DB.set('technicians',techs);renderTechnicians();}

// ── CUSTOMER EXCEL IMPORT (Settings → Import tab) ───────────────────────────
let _importRows=[];

async function _loadXLSX(){
  if(window.XLSX)return;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
}

async function previewImport(input){
  const file=input.files[0];
  if(!file)return;
  document.getElementById('importFileName').textContent=file.name;
  const msg=document.getElementById('importMsg2');
  msg.textContent='Reading file…';msg.style.color='#888';
  try{
    await _loadXLSX();
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    // Convert to 2D array (keep everything including blanks)
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});

    // Find the header row — look for row containing "Cust. First" or "Name"
    let headerIdx=-1;
    for(let i=0;i<Math.min(aoa.length,15);i++){
      const row=aoa[i].map(v=>String(v||'').toLowerCase());
      if(row.some(v=>v.includes('cust. first')||v.includes('cust first')||v==='name')){
        headerIdx=i;break;
      }
    }
    // Fallback: if no special header found, treat row 0 as header
    if(headerIdx===-1)headerIdx=0;

    const headers=aoa[headerIdx].map(v=>String(v||'').trim());
    const ci=(keys)=>{
      const idx=headers.findIndex(h=>keys.some(k=>h.toLowerCase().includes(k)));
      return idx>=0?idx:null;
    };
    const iName =ci(['cust. first','cust first','name','first']);
    const iPhone =ci(['mobile','phone','cell','tel']);
    const iBday  =ci(['birthday','bday','birth']);
    const iVisit =ci(['no. of visit','visits','visit']);
    const iSpent =ci(['up-to-date spend','spending','spent','amount']);
    const iLast  =ci(['last serv. date','last service','last visit']);

    if(iName===null){msg.style.color='#ef4444';msg.textContent='❌ Could not find a Name column. Make sure headers include "Cust. First" or "Name".';return;}

    const existing=DB.get('customers')||[];
    const existPhones=new Set(existing.map(c=>c.phone).filter(Boolean));

    _importRows=[];
    for(let i=headerIdx+1;i<aoa.length;i++){
      const row=aoa[i];
      const name=String(row[iName]||'').trim();
      if(!name)continue;
      const phone=iPhone!==null?String(row[iPhone]||'').replace(/\D/g,'').slice(-10):'';
      const birthday=iBday!==null?String(row[iBday]||'').trim():'';
      const visits=iVisit!==null?parseFloat(row[iVisit])||0:0;
      const totalSpent=iSpent!==null?parseFloat(row[iSpent])||0:0;
      const lastVisit=iLast!==null?String(row[iLast]||'').trim():'';
      const dup=phone.length===10&&existPhones.has(phone);
      _importRows.push({name,phone,birthday,visits,totalSpent,lastVisit,dup});
    }

    const toAdd=_importRows.filter(r=>!r.dup).length;
    const skipped=_importRows.filter(r=>r.dup).length;
    document.getElementById('importSummaryBar').innerHTML=`
      <div style="background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:8px 14px;font-weight:700;color:#15803d">${toAdd} to import</div>
      ${skipped?`<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:8px 14px;font-weight:700;color:#ea580c">${skipped} duplicates skipped</div>`:''}
      <div style="background:#f5f5f5;border:1px solid #e0e0e0;border-radius:8px;padding:8px 14px;color:#555">${_importRows.length} total rows</div>`;

    document.getElementById('importPreviewBody').innerHTML=_importRows.slice(0,200).map((r,i)=>`
      <tr style="border-bottom:1px solid #f5f5f5${r.dup?';opacity:.4':''}">
        <td style="padding:7px 12px;color:#aaa">${i+1}</td>
        <td style="padding:7px 12px;font-weight:600">${r.name}</td>
        <td style="padding:7px 12px;color:#555">${r.phone||'—'}</td>
        <td style="padding:7px 12px;color:#555">${r.birthday||'—'}</td>
        <td style="padding:7px 12px;text-align:center">${r.visits||0}</td>
        <td style="padding:7px 12px">${r.totalSpent?'$'+r.totalSpent.toFixed(2):'—'}</td>
        <td style="padding:7px 12px"><span style="font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:${r.dup?'#fff7ed':'#f0fdf4'};color:${r.dup?'#ea580c':'#15803d'}">${r.dup?'SKIP':'ADD'}</span></td>

function runImportCustomers(){
  const toAdd=_importRows.filter(r=>!r.dup);
  if(!toAdd.length){document.getElementById('importMsg2').textContent='Nothing new to import.';return;}
  const customers=DB.get('customers')||[];
  const existPhones=new Set(customers.map(c=>c.phone).filter(Boolean));
  let added=0;
  toAdd.forEach(r=>{
    if(r.phone&&existPhones.has(r.phone))return;
    customers.push({
      id:Date.now()+Math.floor(Math.random()*100000)+added,
      name:r.name,phone:r.phone||'',email:'',
      birthday:r.birthday||'',
      visits:r.visits||0,
      totalSpent:r.totalSpent||0,
      points:Math.floor((r.totalSpent||0)),
      lastVisit:r.lastVisit||'',
      notes:'',source:'import'
    });
    if(r.phone)existPhones.add(r.phone);
    added++;
  });
  DB.set('customers',customers);
  const msg=document.getElementById('importMsg2');
  msg.style.color='#15803d';
  msg.textContent=`✓ Successfully imported ${added} customers!`;
  document.getElementById('importPreviewWrap').style.display='none';
  document.getElementById('custImportFile2').value='';
  document.getElementById('importFileName').textContent='';
  _importRows=[];
  toast(`Imported ${added} customers`);
}

async function deleteGiftCard(code){
  if(!confirm('Delete gift card '+code+'?'))return;
  await fetch('/api/giftcard/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})}).catch(()=>{});
  renderGiftCardsSettingsBody();
  toast('Card '+code+' deleted');
}

async function deleteAllZeroGiftCards(){
  if(!confirm('Delete all gift cards with $0.00 balance?'))return;
  let removed=0;
  try{
    const res=await fetch('/api/giftcards');
    const cardList=await res.json();
    for(const c of cardList){
      if((c.balance||0)<=0){
        await fetch('/api/giftcard/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c.gc_code})});
        removed++;
      }
    }
  }catch{toast('Server not reachable');return;}
  renderGiftCardsSettingsBody();
  toast(removed+' card(s) removed');
}
async function exportCustomerReport(){
  await _loadXLSX();
  const fromVal=document.getElementById('rpt_from').value;
  const toVal=document.getElementById('rpt_to').value;
  const msg=document.getElementById('rptMsg');
  msg.textContent='Building report…';

  const customers=DB.get('customers')||[];
  const tickets=DB.get('tickets')||[];
  const techs=DB.get('technicians')||[];
  const techMap={};techs.forEach(t=>techMap[t.id]=t.name);

  // Filter tickets by date range if set
  const fromMs=fromVal?new Date(fromVal).getTime():0;
  const toMs=toVal?new Date(toVal+'T23:59:59').getTime():Infinity;
  const filteredTickets=tickets.filter(t=>{
    const ts=t.timestamp||new Date(t.date).getTime();
    return ts>=fromMs&&ts<=toMs&&t.status==='paid';
  });

  // Build per-customer stats from tickets
  const stats={};
  filteredTickets.forEach(t=>{
    const cid=t.customerId;
    if(!cid)return;
    if(!stats[cid])stats[cid]={visits:0,spent:0,lastDate:'',lastAmt:0,lastTech:'',pointsEarned:0,pointsRedeemed:0};
    const s=stats[cid];
    s.visits++;
    s.spent+=t.total||0;
    s.pointsEarned+=t.pointsEarned||0;
    s.pointsRedeemed+=t.gcApplied||0;
    if(!s.lastDate||t.date>s.lastDate){
      s.lastDate=t.date;s.lastAmt=t.total||0;
      s.lastTech=techMap[t.techId]||'';
    }
  });

  // Summary counts
  const totalItems=customers.length;
  const vip=customers.filter(c=>c.classification==='VIP'||(stats[c.id]&&stats[c.id].visits>=10)).length;
  const loyal=customers.filter(c=>stats[c.id]&&stats[c.id].visits>=5&&stats[c.id].visits<10).length;
  const firstTime=customers.filter(c=>!stats[c.id]||stats[c.id].visits<=1).length;
  const totalWI=customers.filter(c=>!c.phone||c.source==='kiosk').length;
  const newC=customers.filter(c=>!stats[c.id]||stats[c.id].visits===0).length;

  const fromDisp=fromVal||'—';
  const toDisp=toVal||'—';

  // Build AOA matching exact report format
  const rows=[
    ['CUSTOMER REPORT',null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
    ['From Date',null,'OVERALL SUMMARY:',null,null,' ',null,null,null,null,null,null,null,null,null,null,null],
    [fromDisp,null,null,null,' VIP: ',vip,'STD:',0,null,null,' Total Appt: ',0,null,null,null,null,null],
    ['To Date',null,'Total Items:',totalItems,' Loyal: ',loyal,'First Time:',firstTime,null,null,' Total WI: ',totalWI,null,null,null,null,null],
    [toDisp,null,null,null,' New: ',newC,'N/A:',0,null,null,null,null,null,null,null,null,null],
    // Column headers — exact match to original
    ['No.','Cust. First','Cust. Mobile','Birthday','Class.','Last Serv. Date','Last Serv. Amount','No. Of Visit ','Status','Up-To-Date Spendings','Main Tech Last Serv.','Sup. Tech Last Serv.','No. Of Days   Un-Returned','Point Earned','Point Redeemed','Email','Remarks'],
  ];

  // Data rows
  const today2=new Date();
  customers.forEach((c,i)=>{
    const s=stats[c.id]||{visits:0,spent:0,lastDate:'',lastAmt:0,lastTech:'',pointsEarned:0,pointsRedeemed:0};
    // Days un-returned
    let daysUnreturned='';
    if(s.lastDate){
      const last=new Date(s.lastDate);
      daysUnreturned=Math.floor((today2-last)/(1000*60*60*24));
    }
    // Classification
    let cls='NEW';
    if(s.visits>=10)cls='VIP';
    else if(s.visits>=5)cls='LOYAL';
    else if(s.visits>=2)cls='STD';

    rows.push([
      i+1,
      c.name||'',
      c.phone||'',
      c.birthday||'',
      cls,
      s.lastDate||'',
      s.lastAmt?parseFloat(s.lastAmt.toFixed(2)):0,
      s.visits,
      'ACTIVATED',
      s.spent?parseFloat(s.spent.toFixed(2)):0,
      s.lastTech||'',
      '',
      daysUnreturned,
      c.points||s.pointsEarned||0,
      s.pointsRedeemed||0,
      c.email||'',
      c.notes||'',
    ]);
  });

  const ws=XLSX.utils.aoa_to_sheet(rows);

  // Column widths
  ws['!cols']=[
    {wch:6},{wch:22},{wch:16},{wch:10},{wch:8},
    {wch:16},{wch:16},{wch:12},{wch:12},{wch:20},
    {wch:20},{wch:20},{wch:18},{wch:12},{wch:14},{wch:24},{wch:20}
  ];

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Customer');
  const filename=`customer_report_${toDisp.replace(/\//g,'-')||today()}.xlsx`;
  XLSX.writeFile(wb,filename);
  msg.style.color='#22c55e';
  msg.textContent=`✓ Exported ${customers.length} customers`;
  toast('Customer report downloaded!');
}

function saveService(id){
  const name=document.getElementById('ns_name').value.trim();
  const price=parseFloat(document.getElementById('ns_price').value);
  const dur=parseInt(document.getElementById('ns_dur').value)||30;
  const customCat=document.getElementById('ns_cat_custom').value.trim();
  const category=customCat||document.getElementById('ns_cat').value;
  if(!name){toast('Service name required');return;}
  if(isNaN(price)||price<0){toast('Enter a valid price');return;}
  if(!category){toast('Category required');return;}
  const services=DB.get('services')||[];
  if(id){
    const s=services.find(x=>x.id===id);
    if(s){s.name=name;s.price=price;s.duration=dur;s.category=category;}
  } else {
    services.push({id:genId(),name,price,duration:dur,category});
  }
  DB.set('services',services);
  closeModal();
  renderSettings();
  toast(id?'Service updated!':'Service added!');

function toWeekStr(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  // ISO week
  const tmp=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=tmp.getUTCDay()||7;
  tmp.setUTCDate(tmp.getUTCDate()+4-day);
  const yearStart=new Date(Date.UTC(tmp.getUTCFullYear(),0,1));
  const weekNo=Math.ceil((((tmp-yearStart)/86400000)+1)/7);
  return `${tmp.getUTCFullYear()}-W${String(weekNo).padStart(2,'0')}`;
}

function weekStrToMonday(weekStr){
  const [yr,wk]=weekStr.split('-W').map(Number);
  const d=new Date(yr,0,1+((wk-1)*7));
  const day=d.getDay();
  d.setDate(d.getDate()-(day===0?6:day-1));
  return d.toISOString().split('T')[0];
}

function rGetFiltered(){
  const tickets=(DB.get('tickets')||[]).filter(t=>t.status!=='voided');
  const tab=window._rTab;
  if(tab==='daily'){
    const dt=window._rDate||today();
    return tickets.filter(t=>t.date===dt);
  }
  if(tab==='weekly'){
    const monday=new Date((window._rWeekOf||today())+'T00:00:00');
    const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
    return tickets.filter(t=>{
      const d=new Date(t.date+'T00:00:00');
      return d>=monday&&d<=sunday;
    });
  }
  if(tab==='biweekly'){
    const start=new Date((window._rBiStart||weekStrToMonday(toWeekStr(today())))+'T00:00:00');
    const end=new Date(start);end.setDate(start.getDate()+13);
    return tickets.filter(t=>{
      const d=new Date(t.date+'T00:00:00');
      return d>=start&&d<=end;
    });
  }
  if(tab==='monthly'){
    const yr=window._rYear,mo=window._rMonth;
    return tickets.filter(t=>{
      const d=new Date(t.date+'T00:00:00');
      return d.getFullYear()===yr&&d.getMonth()===mo;
    });
  }
  if(tab==='yearly'){
    const yr=window._rYear;
    return tickets.filter(t=>t.date&&t.date.startsWith(String(yr)));
  }
  return tickets; // history = all
}

function rPeriodLabel(){
  const tab=window._rTab;
  if(tab==='daily')return fmtDate(window._rDate||today());
  if(tab==='weekly'){
    const monday=new Date((window._rWeekOf||today())+'T00:00:00');
    const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
    return `Week of ${fmtDate(monday.toISOString().split('T')[0])} – ${fmtDate(sunday.toISOString().split('T')[0])}`;
  }
  if(tab==='biweekly'){
    const start=new Date((window._rBiStart||weekStrToMonday(toWeekStr(today())))+'T00:00:00');
    const end=new Date(start);end.setDate(start.getDate()+13);
    return `Biweekly ${fmtDate(start.toISOString().split('T')[0])} – ${fmtDate(end.toISOString().split('T')[0])}`;
  }
  if(tab==='monthly'){
    const monthNamesLong=['January','February','March','April','May','June','July','August','September','October','November','December'];
    return `${monthNamesLong[window._rMonth]} ${window._rYear}`;
  }
  if(tab==='yearly')return `Year ${window._rYear}`;
  return '';
}

// Shared aggregation used by the on-screen report, CSV export, and PDF export
// so the three stay consistent with each other.
function _rComputeReportData(){
  const techId=window._rTechId===undefined?'all':window._rTechId;
  const techs=DB.get('technicians')||[];
  const filtered=rGetFiltered().map(t=>{
    const refunded=t.refundedAmount||0;
    if(refunded<=0)return t;
    return Object.assign({},t,{subtotal:Math.max(0,t.subtotal-refunded),total:Math.max(0,t.total-refunded)});
  }).filter(t=>techId==='all'||t.techId===techId);

  const rev=filtered.reduce((s,t)=>s+t.subtotal,0);
  const tips=filtered.reduce((s,t)=>s+(t.tip||0),0);
  const disc=filtered.reduce((s,t)=>s+(t.discount||0),0);
  const total=filtered.reduce((s,t)=>s+t.total,0);

  const techStats=techs.map(t=>{
    const tt=filtered.filter(x=>x.techId===t.id);
    const r=tt.reduce((s,x)=>s+x.subtotal,0);
    const tips2=tt.reduce((s,x)=>s+(x.tip||0),0);
    return {name:t.name,color:t.color,tickets:tt.length,revenue:r,tips:tips2,payout:r*(t.commission||0.5)};
  }).filter(t=>t.tickets>0).sort((a,b)=>b.revenue-a.revenue);

  const svcMap={};
  filtered.forEach(t=>(t.services||[]).forEach(s=>{
    if(!svcMap[s.name])svcMap[s.name]={name:s.name,count:0,rev:0};
    svcMap[s.name].count++;svcMap[s.name].rev+=s.price;
  }));
  const svcList=Object.values(svcMap).sort((a,b)=>b.rev-a.rev);

  const payMap={};
  filtered.forEach(t=>{const k=t.payMethod||'cash';payMap[k]=(payMap[k]||0)+t.total;});

  const scopeLabel=techId==='all'?'All Technicians':((techs.find(t=>t.id===techId)||{}).name||'Unknown');

  return {filtered,techId,rev,tips,disc,total,techStats,svcList,payMap,scopeLabel,label:rPeriodLabel()};
}

function rExportCSV(){
  const techs=DB.get('technicians')||[];
  const d=_rComputeReportData();
  const esc=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const lines=[];
  lines.push(['Report',d.label].map(esc).join(','));
  lines.push(['Scope',d.scopeLabel].map(esc).join(','));
  lines.push(['Revenue',d.rev.toFixed(2)].map(esc).join(','));
  lines.push(['Tickets',d.filtered.length].map(esc).join(','));
  lines.push(['Tips',d.tips.toFixed(2)].map(esc).join(','));
  lines.push(['Discounts',d.disc.toFixed(2)].map(esc).join(','));
  lines.push(['Net Collected',d.total.toFixed(2)].map(esc).join(','));
  lines.push('');
  lines.push(['Ticket','Date','Customer','Technician','Services','Subtotal','Discount','Tip','Total','Payment Method','Gift Card #'].map(esc).join(','));
  d.filtered.forEach(t=>{
    const tech=techs.find(x=>x.id===t.techId);
    const techName=t.techId===0?'Any':(tech?tech.name:'');
    lines.push([
      '#'+String(t.id).slice(-6),t.date,t.customerName||'Walk-in',techName,
      (t.services||[]).map(s=>s.name).join('; '),t.subtotal.toFixed(2),(t.discount||0).toFixed(2),
      (t.tip||0).toFixed(2),t.total.toFixed(2),(t.payMethod||'cash'),t.gcCode||''
    ].map(esc).join(','));
  });
  const csv=lines.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`report-${window._rTab}-${today()}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
